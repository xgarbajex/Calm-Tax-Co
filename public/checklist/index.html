.entry-card{margin:12px 0 0 34px;border:1px solid rgba(125,142,126,.22);background:rgba(125,142,126,.045);border-radius:16px;padding:16px 16px 14px}
.entry-title{font-family:Lora,serif;font-size:19px;font-weight:500;color:var(--ink);margin:0 0 5px}
.entry-help{font-size:13px;line-height:1.55;color:var(--mid);margin:0 0 14px}
.entry-help em,.soft-em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--sage);font-size:1.15em}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.entry-field{display:flex;flex-direction:column;gap:6px}
.entry-field.full{grid-column:1/-1}
.entry-field label{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mid)}
.entry-field input,.entry-field select,.entry-field textarea{width:100%;border:1px solid rgba(60,54,51,.14);border-radius:12px;background:#fff;color:var(--ink);font-family:Inter,sans-serif;font-size:15px;padding:12px 13px;outline:none}
.entry-field textarea{min-height:82px;resize:vertical;line-height:1.5}
.entry-field input:focus,.entry-field select:focus,.entry-field textarea:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(125,142,126,.10)}
.sensitive-wrap{position:relative}
.sensitive-wrap input{padding-right:44px}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:999px;background:rgba(125,142,126,.10);color:var(--sage);cursor:pointer;font-size:15px}
.entry-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.entry-save{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 15px;font-family:Inter,sans-serif;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.entry-save:hover{background:var(--sage)}
.entry-validation{font-size:13px;line-height:1.4;color:var(--mid);min-height:18px}
.entry-validation.ok{color:var(--sage);font-weight:600}
.entry-validation.attn{color:var(--clay);font-weight:600}
.entry-divider{height:1px;background:rgba(60,54,51,.09);margin:15px 0 12px}
.upload-alternative{font-size:13px;color:var(--mid);line-height:1.55;margin:0}
.upload-alternative em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--sage);font-size:1.16em}
.help-panel-link{border:0;background:transparent;color:var(--sage);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:Inter,sans-serif;font-size:13px;padding:0;margin:0}
.inline-help-panel{display:none;margin:10px 0 0;padding:13px 14px;border:1px solid rgba(125,142,126,.24);border-radius:12px;background:#fff;color:var(--mid);font-size:13px;line-height:1.6}
.inline-help-panel.open{display:block}
.inline-help-panel ul{margin:8px 0 8px 18px;padding:0}
.inline-help-panel li{margin:4px 0}
.help{cursor:pointer}
.help.open .tip{display:block}
@media(max-width:700px){.entry-card{margin-left:0}.entry-grid{grid-template-columns:1fr}.entry-actions{align-items:stretch}.entry-save,.row-upload-btn{min-height:42px}.help{width:30px;height:30px;margin-left:8px}.tip{left:auto;right:0;top:34px;width:min(340px,84vw)}}


/* Calm Tax v1.2 checklist polish */
.item.row-upload{padding:18px 16px;margin-bottom:14px;border-radius:16px;gap:14px;}
.item-head{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;width:100%;}
.item-title-wrap{min-width:0;width:100%;}
.label{display:block;width:100%;font-size:15.5px;line-height:1.5;}
.item-actions{grid-column:2;margin:12px 0 0 0;padding-left:0;justify-content:flex-start;flex-wrap:wrap;gap:8px;}
.action-pill{border:1px solid rgba(125,142,126,.34);background:rgba(255,255,255,.82);color:var(--ink);border-radius:999px;min-height:38px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(60,54,51,.025);transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease;}
.action-pill:hover{background:rgba(125,142,126,.10);border-color:rgba(125,142,126,.55);transform:translateY(-1px);box-shadow:0 5px 14px rgba(60,54,51,.05);}
.action-pill.terracotta{border-color:rgba(166,109,94,.28);background:rgba(166,109,94,.055);}
.action-pill.terracotta:hover{background:rgba(166,109,94,.10);border-color:rgba(166,109,94,.44);}
.row-upload-btn{font-size:13px;letter-spacing:0;text-transform:none;min-height:38px;}
.entry-card{display:none;margin:14px 0 0 0;}
.entry-card.open{display:block;}
.entry-title{font-style:italic;}
.progress-pill{background:rgba(125,142,126,.10);color:var(--sage);text-transform:none;letter-spacing:.01em;font-weight:600;}
.help{cursor:pointer;}
.help.open .tip{display:block;}
.tip{cursor:default;}

function cleanItemLabel(value){let text=String(value||'').replace(/^•\s*/,'').trim();const lower=text.toLowerCase();if(lower.includes('mileage records for business driving')||((lower.includes('mileage')||lower.includes('business miles'))&&!lower.includes('vehicle details')))return 'Vehicle details and mileage records';if(lower.includes('phone')&&lower.includes('internet')&&lower.includes('business-use percentage'))return 'Total annual cost(s) of phone and/or internet';if((lower.includes('supplies')&&lower.includes('equipment')&&lower.includes('tools'))||(lower.includes('total amount spent')&&(lower.includes('supplies')||lower.includes('equipment')||lower.includes('tools'))))return 'Supplies, equipment, and tools purchased for work - provide totals by category';if(lower.includes('business expense totals')||lower.includes('total annual expense amount'))return 'Business expense totals by category';if(lower.includes('cost of goods')||lower.includes('inventory'))return 'Inventory $ values and inventory purchase total';if(lower.includes('rental expense'))return 'Rental expense totals by category';return text.replace(/\s*\(secure upload only\)\s*/gi,'').replace(/\s*\(provide only through your secure upload page\s*-\s*do not email it\)\s*/gi,'').replace(/\s*\(provide only through your secure upload folder\s*-\s*do not email it\)\s*/gi,'').replace(/\s*\(do not email it\)\s*/gi,'');}

 of your home regularly and exclusively for business. You can enter the home office details here, or upload a document or spreadsheet with the square footage and related home expenses.';if(t.includes('cost of goods')||t.includes('inventory'))return 'If you sell physical products, upload the $ value of your inventory on Jan 1, the $ value of your inventory on Dec 31, and your inventory purchase total for the year, if available.';if(t.includes('business expense totals')||t.includes('total annual expense amount')||t.includes('supplies')||t.includes('equipment')||t.includes('tools'))return 'Please upload totals by category rather than individual receipts. <br><br><a href="'+EXPENSE_GUIDE_URL+'" target="_blank" rel="noopener">View our business expense category guide</a>.';if(t.includes('form 1099-s')||t.includes('major home improvements'))return 'If you sold your home during the year, upload your Closing Disclosure (or settlement statement), Form 1099-S if you received one, and records of major improvements if available. These help determine any taxable gain and any applicable home sale exclusion.';if(t.includes('estimated tax'))return 'Upload IRS/state confirmation emails, EFTPS confirmations, bank records, or a list of dates and amounts paid.';if(t.includes('bank routing')||t.includes('bank account information')||t.includes('routing number'))return 'Enter your routing and account numbers from your bank app, statement, or a voided check. You can also upload a document instead. Please do not email banking information.';return '';}

r as you find more.<br><br><span class="checklist-subheading">Returning later?</span>We’ve emailed you a link to this page so you can easily return at any time. If you don’t see it within a few minutes, please check your spam or junk folder, and consider adding hello@calmtax.co to your contacts.<br><br><span class="checklist-subheading">What happens next?</span>Once you’ve completed your checklist, we’ll review everything and email you your personalized quote.<br>After you’ve approved your quote and payment has been received, we’ll get started on preparing your return.</p>'+(state.uploadsLockedMessage?'<div class="privacy lock-note"><strong>Uploads locked:</strong> '+esc(state.uploadsLockedMessage)+'</div>':'')+'<div class="card"><h2 style="text-align:center;">Checklist</h2><div class="progress-pill" style="display:flex;margin:0 auto 18px;">'+progressText(completedCount(),items.length)+'</div><p>For each item, choose one option: take a photo, upload a file, or enter the information directly when available. You can manually check or uncheck items anytime.</p><div id="checklistList">'+(checklistHtml||'<p>No checklist items found. Please contact us if you think this is an error.</p>')+'</div>'+normalOtherUploadHtml(otherFiles)+'</div>';}html+='<div class="privacy"><strong>Privacy &amp; security:</strong> Use this secure upload page for tax documents and personal information. Please do not email Social Security numbers, banking details, or tax documents.</div><div class="contact-card"><span class="contact-icon">✉</span><span>Questions? Reply to your checklist email or contact <a class="contact-email" href="mailto:hello@calmtax.co">hello@calmtax.co</a>.</span></div><p class="footer-note">© 2026 Calm Tax Co.</p>';document.getElementById('app').innerHTML=html;}function completedCount(){return visibleChecklistItems().filter(function(row){return checked.has(row.idx);}).length;}

function rowDragOver(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('drag-over');}
function rowDragLeave(e,idx){e.preventDefault();e.stopPropagation();const row=e.currentTarget;if(!row||row.contains(e.relatedTarget))return;row.classList.remove('drag-over');}
function rowDrop(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drag-over');const files=Array.from(e.dataTransfer&&e.dataTransfer.files?e.dataTransfer.files:[]);if(files.length)uploadFilesForChecklistItem(idx,files);}
function openOtherFilePicker(e){if(e)e.stopPropagation();const input=document.getElementById('otherFileInput');if(input)input.click();}
function handleOtherFileInput(e){const files=Array.from(e.target.files||[]);e.target.value='';if(files.length)uploadFilesAsOther(files);}
function otherDragEnter(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.add('drag-over');}
function otherDragOver(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.add('drag-over');}
function otherDragLeave(e){e.preventDefault();e.stopPropagation();const row=document.getElementById('otherUploadRow');if(!row||row.contains(e.relatedTarget))return;row.classList.remove('drag-over');}
function otherDrop(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.remove('drag-over');const files=Array.from(e.dataTransfer&&e.dataTransfer.files?e.dataTransfer.files:[]);if(files.length)uploadFilesAsOther(files);}
async function uploadFilesForChecklistItem(idx,files){const button=document.getElementById('uploadBtn-'+idx);if(button)button.disabled=true;try{for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus(idx,'loading',prefix+'Uploading '+originalFile.name+' ('+formatFileSize(originalFile.size)+')…');const dataUrl=await readFileAsDataURL(originalFile);const label=selectedLabelForIndex(idx);const cleanLabel=cleanDocLabel(label);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:label,docTypeLabel:cleanLabel,checklistIndex:idx}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:idx,docTypeLabel:cleanLabel});}checked.add(Number(idx));await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});render();setRowStatus(idx,'success',files.length>1?files.length+' files uploaded.':'Upload complete.');}catch(error){setRowStatus(idx,'error','Upload failed: '+error.message);}finally{const fresh=document.getElementById('uploadBtn-'+idx);if(fresh)fresh.disabled=false;}}
async function uploadFilesAsOther(files){try{const returnReady=isReturnReadyMode();const docLabel=returnReady?'Signed Form 8879':'Other Documents';for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus('other','loading',prefix+'Uploading '+originalFile.name+'…');const dataUrl=await readFileAsDataURL(originalFile);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:docLabel,docTypeLabel:docLabel,checklistIndex:''}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:'',docTypeLabel:docLabel});}render();setRowStatus('other','success',returnReady?'Form 8879 uploaded successfully.':(files.length>1?files.length+' files uploaded.':'Upload complete.'));}catch(error){setRowStatus('other','error','Upload failed: '+error.message);}}
function deleteFile(fileId,event){event.stopPropagation();if(!fileId||state.canDeleteFiles===false)return;const button=event.currentTarget;const row=button?button.closest('.row-file'):null;if(!row)return;document.querySelectorAll('.delete-confirm').forEach(function(p){p.remove();});document.querySelectorAll('.confirming-delete').forEach(function(el){el.classList.remove('confirming-delete');});const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const name=rec?(clientDisplayFileName(rec)||'this file'):'this file';row.classList.add('confirming-delete');const panel=document.createElement('div');panel.className='delete-confirm';panel.innerHTML='<div>Delete “'+esc(name)+'”? This cannot be undone.</div><div class="delete-confirm-actions"><button type="button" class="delete-confirm-cancel">Cancel</button><button type="button" class="delete-confirm-ok">Delete file</button></div>';row.appendChild(panel);panel.querySelector('.delete-confirm-cancel').onclick=function(e){e.stopPropagation();panel.remove();row.classList.remove('confirming-delete');};panel.querySelector('.delete-confirm-ok').onclick=function(e){e.stopPropagation();confirmDeleteFile(fileId,row,button,e.currentTarget);};}
async function confirmDeleteFile(fileId,row,originalButton,confirmButton){const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const deletedIndex=rec&&rec.checklistIndex!==undefined&&rec.checklistIndex!==''?Number(rec.checklistIndex):null;row.classList.add('deleting');if(originalButton)originalButton.disabled=true;if(confirmButton){confirmButton.disabled=true;confirmButton.innerHTML='<span class="mini-spinner"></span>Deleting...';}try{await api({form_type:'deleteFile',clientId:CLIENT_ID,fileId:fileId});state.uploadedFiles=(state.uploadedFiles||[]).filter(function(f){return String(f.id)!==String(fileId);});if(deletedIndex!==null&&!Number.isNaN(deletedIndex)){const still=state.uploadedFiles.some(function(f){return Number(f.checklistIndex)===Number(deletedIndex);});if(!still){checked.delete(deletedIndex);await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});}}render();}catch(error){row.classList.remove('deleting');if(originalButton)originalButton.disabled=false;if(confirmButton){confirmButton.disabled=false;confirmButton.textContent='Delete file';}const p=row.querySelector('.delete-confirm div');if(p)p.textContent='Delete failed: '+error.message;}}
function openSignHelpModal(event){if(event)event.stopPropagation();const modal=document.getElementById('signHelpModal');if(modal)modal.classList.add('open');}
function closeSignHelpModal(event){if(event)event.stopPropagation();const modal=document.getElementById('signHelpModal');if(modal)modal.classList.remove('open');}
function showDeviceHelp(device,event){if(event)event.stopPropagation();document.querySelectorAll('.device-btn').forEach(function(btn){btn.classList.remove('active');});if(event&&event.currentTarget)event.currentTarget.classList.add('active');document.querySelectorAll('.device-panel').forEach(function(panel){panel.classList.remove('active');});const panel=document.getElementById('device-'+device);if(panel)panel.classList.add('active');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSignHelpModal(e);});
window.addEventListener('error',function(e){const app=document.getElementById('app');if(app&&app.textContent.indexOf('Loading your checklist')!==-1){app.innerHTML='<div class="err"><strong>The checklist could not load.</strong><br>'+esc(e.message||'A page error occurred.')+'<br><br>Please refresh the page. If the problem continues, contact hello@calmtax.co.</div>';}});
load();
</script>
</body>
