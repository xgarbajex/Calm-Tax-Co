<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm Tax Co. Document Checklist & Upload Page</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf8f5; --bg2:#f4f1ea; --white:#fff; --ink:#3C3633; --mid:#4A545C;
  --sage:#7D8E7E; --clay:#A66D5E; --border:rgba(60,54,51,.12);
  --success:#2e7d32; --r:14px; --rl:20px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:980px; margin:0 auto; padding:32px 18px 80px; }
.card { background:transparent; border:0; border-radius:0; box-shadow:none; padding:0; }
.brand { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:24px; margin-bottom:30px; gap:16px; }
.logo-svg { width:260px; max-width:58vw; height:auto; display:block; }
.year { text-align:right; }
.year-label { font-size:12px; text-transform:uppercase; letter-spacing:.16em; color:var(--mid); opacity:.65; }
.year-num { font-family:Lora,serif; font-size:34px; }
.title { text-align:center; font-family:Lora,serif; font-style:italic; font-size:44px; line-height:1.1; font-weight:400; margin:18px 0 24px; }
.intro { text-align:center; max-width:720px; margin:0 auto 30px; font-family:Lora,serif; font-size:17px; line-height:1.65; }
.steps { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; border-top:1px solid var(--border); padding-top:30px; margin:28px 0; }
.step { text-align:center; }
.num { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--sage); font-family:Lora,serif; font-weight:600; }
.step h3 { font-family:Lora,serif; font-style:italic; font-size:21px; margin:12px 0 8px; }
.step p { font-size:14px; line-height:1.55; color:var(--mid); margin:0; }
.journey { margin:28px 0; padding:22px 18px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.journey-title { text-align:center; font-family:Lora,serif; font-size:21px; font-style:italic; margin:0 0 18px; color:var(--ink); }
.journey-track { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative; }
.journey-track::before { content:""; position:absolute; left:12%; right:12%; top:19px; height:1.5px; border-top:2px dashed rgba(125,142,126,.28); z-index:0; }
.journey-step { position:relative; z-index:1; flex:1; text-align:center; color:var(--mid); }
.journey-dot { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:Lora,serif; font-size:15px; box-shadow:0 2px 8px rgba(60,54,51,.06); margin-bottom:9px; }
.journey-label { display:block; font-size:12px; line-height:1.35; font-weight:600; color:var(--mid); }
.journey-step.done .journey-dot { background:var(--sage); border-color:var(--sage); color:#fff; }
.journey-step.current .journey-dot { background:var(--ink); border-color:var(--ink); color:#fff; transform:scale(1.08); }
.journey-step.current .journey-label { color:var(--ink); }
.journey-note { display:block; margin-top:4px; font-size:11px; color:var(--sage); font-weight:600; }
.journey-step.future { opacity:1; }

.checklist-legend { display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:rgba(125,142,126,.06); border:1px solid rgba(125,142,126,.18); border-radius:12px; padding:12px 14px; margin:22px 0 10px; font-size:13px; color:var(--mid); }
.legend-item { display:inline-flex; align-items:center; gap:7px; }
.legend-circle { width:18px; height:18px; border-radius:50%; border:1.5px solid #c9c9c9; background:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:transparent; }
.legend-circle.complete { background:var(--sage); border-color:var(--sage); color:#fff; }
.item.row-upload { align-items:stretch; cursor:default; background:#fff; border:1px solid rgba(60,54,51,.08); margin-bottom:8px; transition:background .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
.item.row-upload:hover { background:#fff; }
.item.row-upload.drag-over { background:rgba(125,142,126,.10); border-color:var(--sage); box-shadow:0 8px 22px rgba(60,54,51,.08); transform:translateY(-1px); }
.item-main { flex:1; min-width:0; }
.item-head { display:flex; gap:12px; align-items:flex-start; }
.item-actions { display:flex; align-items:flex-start; justify-content:flex-end; gap:8px; margin-left:auto; padding-left:10px; }
.row-upload-btn { border:1px solid rgba(125,142,126,.36); background:#fff; color:var(--ink); border-radius:999px; padding:8px 13px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
.row-upload-btn:hover { background:rgba(125,142,126,.10); }
.row-upload-btn[disabled] { opacity:.65; cursor:wait; }
.row-files { margin:10px 0 0 34px; display:flex; flex-direction:column; gap:6px; }
.row-file { display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--border); background:#fafafa; border-radius:9px; padding:8px 10px; font-size:13px; color:var(--mid); }
.row-file-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-status { margin:8px 0 0 34px; font-size:13px; color:var(--mid); display:flex; align-items:center; gap:8px; }
.other-upload-row { margin-top:18px; border:1px dashed rgba(125,142,126,.45); background:rgba(125,142,126,.05); border-radius:14px; padding:16px; text-align:center; transition:background .16s ease, border-color .16s ease, transform .16s ease; }
.other-upload-row.drag-over { background:rgba(125,142,126,.12); border-color:var(--sage); transform:translateY(-1px); }
.other-upload-row h3 { font-family:Lora,serif; font-size:20px; margin:0 0 5px; }
.other-upload-row p { margin:0 0 12px; font-size:13px; color:var(--mid); line-height:1.5; }
.hidden-row-file-input { display:none; }

@media(max-width:700px) {

  .item.row-upload { flex-direction:column; }
  .item-head { width:100%; }
  .item-actions { margin-left:34px; padding-left:0; justify-content:flex-start; }
  .row-files, .row-status { margin-left:34px; }
  .journey { padding:18px 6px; }
  .journey-track { gap:4px; }
  .journey-dot { width:34px; height:34px; font-size:13px; }
  .journey-label { font-size:11px; }
  .journey-track::before { top:16px; left:12%; right:12%; }
}
.upload-box { background:rgba(125,142,126,.07); border:1.5px solid var(--sage); border-radius:var(--r); padding:22px; margin:28px 0 22px; }
.upload-top { display:block; }
.upload-main { width:100%; }
.upload-box h3 { font-family:Lora,serif; font-size:22px; margin:0 0 6px; }
.upload-controls { display:flex; justify-content:center; margin-top:16px; }
.drop-zone { width:100%; border:2px dashed rgba(125,142,126,.55); background:rgba(255,255,255,.65); border-radius:14px; padding:24px 18px; text-align:center; color:var(--mid); transition:background .15s ease, border-color .15s ease, transform .15s ease; }
.drop-zone strong { color:var(--ink); }
.drop-zone.drag-over { background:#fff; border-color:var(--sage); transform:scale(1.01); }
.drop-zone-small { display:block; margin-top:12px; font-size:13px; color:var(--mid); }
.doc-select-wrap { margin:16px auto 0; text-align:center; }
.doc-select-label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mid); margin-bottom:6px; font-weight:600; }
.doc-select { width:min(100%,520px); border:1px solid var(--border); border-radius:12px; padding:11px 12px; font-family:Inter,sans-serif; font-size:14px; color:var(--ink); background:#fff; text-align:left; }
.uploaded-in-card { margin-top:20px; padding-top:16px; border-top:1px solid rgba(125,142,126,.28); }
.uploaded-in-card-title { font-family:Lora,serif; font-size:20px; margin:0 0 10px; }
.btn { font-family:Inter,sans-serif; font-size:13px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:#fff; background:var(--ink); border:0; border-radius:999px; padding:14px 28px; cursor:pointer; text-decoration:none; display:inline-block; }
.btn:hover { background:var(--sage); }
.btn[disabled] { opacity:.55; cursor:wait; }
.status { font-size:14px; color:var(--mid); margin-top:10px; }
.upload-status-line { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; margin-top:10px; font-size:14px; color:var(--mid); }
.upload-spinner { width:24px; height:24px; border-radius:50%; border:3px solid rgba(125,142,126,.22); border-top-color:var(--sage); animation:spin .8s linear infinite; flex:0 0 auto; }
.upload-check { width:26px; height:26px; border-radius:50%; background:var(--success); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex:0 0 auto; }
.mini-spinner { width:14px; height:14px; border-radius:50%; border:2px solid rgba(125,142,126,.22); border-top-color:var(--sage); animation:spin .8s linear infinite; display:inline-block; vertical-align:-2px; margin-right:6px; }
@keyframes spin { to { transform:rotate(360deg); } }
.privacy { border-left:4px solid var(--sage); background:var(--bg2); border-radius:0 var(--r) var(--r) 0; padding:16px 18px 16px 24px; font-size:14px; line-height:1.65; color:var(--mid); margin:22px 0; }
.group-title { font-family:Lora,serif; font-size:23px; margin:30px 0 12px; border-bottom:1px solid var(--border); padding-bottom:8px; }

.item.checked { opacity:.62; }

.checked .check { background:var(--sage); color:#fff; }
.checked .label { text-decoration:line-through; }
.label { font-size:15px; line-height:1.45; font-weight:500; }

.tip { display:none; position:absolute; left:22px; top:-10px; z-index:20; width:min(360px,78vw); background:#fff; border:1px solid var(--border); box-shadow:0 8px 20px rgba(60,54,51,.14); border-radius:10px; padding:12px; text-align:left; color:var(--ink); font-size:13px; line-height:1.45; font-weight:400; text-decoration:none; }
.help:hover .tip, .help:focus .tip, .tip:hover { display:block; }
.tip a { color:var(--sage); font-weight:600; text-decoration:underline; }
.reminder { background:#fff8ea; border:1px solid #ead9b6; border-left:4px solid #d6aa4d; border-radius:0 12px 12px 0; padding:16px 18px 16px 24px; margin:24px 0; font-size:14px; line-height:1.6; }
.files { margin:18px 0 26px; }
.file { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; margin-top:8px; font-size:14px; }
.delete-btn { border:1px solid #e4b6b6; background:#fff5f5; color:#8a3434; border-radius:999px; padding:6px 10px; cursor:pointer; font-size:12px; }

.loading { text-align:center; padding:60px; color:var(--mid); }
.progress-row { margin-top:8px; padding:8px 10px; border:1px dashed var(--border); border-radius:10px; background:#fff; font-size:13px; color:var(--mid); }

.item.row-upload:hover { background:#fff; }

/* Row-based checklist polish */
.title { margin-bottom:18px; }
.intro { margin-bottom:24px; }
.journey { background:transparent; }
.journey-label { font-family:Lora,serif; color:var(--ink); }
.journey-note { display:inline-block; margin-top:6px; padding:4px 10px; border-radius:999px; background:rgba(125,142,126,.12); color:var(--sage); font-family:Inter,sans-serif; font-size:11px; font-weight:600; }
.journey-step.future { opacity:1; }
.journey-dot { background:#fff; position:relative; z-index:2; box-shadow:0 0 0 8px var(--bg), 0 2px 8px rgba(60,54,51,.06); }
.journey-track::before { z-index:0; }
.journey-step.current .journey-dot { background:rgba(125,142,126,.22); border-color:var(--sage); color:var(--ink); }

.checklist-legend { margin:0 0 18px; justify-content:center; background:rgba(125,142,126,.05); }
.checklist-helper { text-align:center; color:var(--mid); font-size:14px; line-height:1.55; margin:10px auto 22px; max-width:720px; }
.item.row-upload { border:1px solid rgba(60,54,51,.09); border-radius:13px; padding:15px 12px; }
.item.row-upload.checked { opacity:1; background:#fff; }
.item.row-upload.checked .label { text-decoration:none; }

.check { background:#fff; border-color:#c7c7c7; color:transparent; }
.label { font-family:Lora,serif; font-size:17px; font-weight:500; color:var(--ink); }

.row-upload-btn { display:inline-flex; align-items:center; gap:6px; font-family:Inter,sans-serif; background:#fff; border:1px solid rgba(125,142,126,.38); color:var(--ink); padding:8px 13px; }

<body>
<div class="wrap"><div class="card" id="app"><div class="loading">Loading your checklist…</div></div></div>

<script>
const AS_URL = 'https://script.google.com/macros/s/AKfycbxIqzdrwed8JgxdUUMMtTqVUQDmEmChlm7411oMGUUAF4Jn_8HinPHNDmNwZKb6vddiXg/exec';
const params = new URLSearchParams(location.search);
const CLIENT_ID = params.get('c') || params.get('checklist');
let state = null;
let checked = new Set();


function cleanItemLabel(value) {
  let text = String(value || '').replace(/^•\s*/, '').trim();
  const lower = text.toLowerCase();

  if (
    (lower.includes('supplies') && lower.includes('equipment') && lower.includes('tools')) ||
    (lower.includes('total amount spent') && (lower.includes('supplies') || lower.includes('equipment') || lower.includes('tools')))
  ) {
    return 'Supplies, equipment, and tools purchased for work — provide totals by category';
  }

  if (lower.includes('business expense totals') || lower.includes('total annual expense amount')) {
    return 'Business expense totals by category';
  }

  if (lower.includes('cost of goods')) {
    return 'Cost of goods sold or inventory totals, if applicable';
  }

  if (lower.includes('rental expense')) {
    return 'Rental expense totals by category';
  }

  text = text.replace(/\s*\(provide only through your secure upload folder\s*—\s*do not email it\)\s*/gi, '');
  text = text.replace(/\s*\(do not email it\)\s*/gi, '');

  return text;
}


function esc(value) {
  return String(value || '').replace(/[&<>"']/g, function (char) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char];
  });
}

async function api(payload) {
  const response = await fetch(AS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });

  const text = await response.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (error) {
    throw new Error('Unexpected server response.');
  }

  if (!data || data.status === 'error') {
    throw new Error(data && data.message ? data.message : 'Request failed.');
  }

  return data;
}

function categoryFor(item) {
  const t = item.toLowerCase();
  if (t.includes('ssn') || t.includes('itin') || t.includes('prior year')) return 'Identity & Prior Return';
  if (t.includes('w-2') || t.includes('1099') || t.includes('income') || t.includes('sales report') || t.includes('ssa-') || t.includes('unemployment')) return 'Income Documents';
  if (t.includes('business') || t.includes('expense') || t.includes('mileage') || t.includes('vehicle') || t.includes('equipment') || t.includes('cost of goods')) return 'Business & Deduction Records';
  if (t.includes('mortgage') || t.includes('property tax') || t.includes('charitable') || t.includes('medical') || t.includes('childcare') || t.includes('home office') || t.includes('student') || t.includes('tuition') || t.includes('ira') || t.includes('adoption') || t.includes('energy') || t.includes('alimony')) return 'Deduction & Credit Records';
  if (t.includes('1095-a') || t.includes('hsa') || t.includes('bank routing') || t.includes('irs notice') || t.includes('state tax notice') || t.includes('estimated tax')) return 'Other Tax Items';
  return 'Additional Documents';
}

function helpFor(item) {
  const t = item.toLowerCase();

  if (t.includes('ssn') || t.includes('itin')) {
    return 'If this number already appears on another uploaded tax form, such as a W-2, you do not need a separate document. If it does not, upload a clear image of a Social Security card, ITIN letter, prior-year return page, or a typed note with the name and number.';
  }

  if (t.includes('prior year return')) {
    return 'Upload last year’s federal and state tax returns if you have them. These help us check carryovers, prior-year credits, depreciation, estimated payments, and basic identifying information.';
  }

  if (t.includes('w-2')) {
    return 'Usually available from your employer or payroll portal, such as ADP, Gusto, Workday, Paychex, or your employer’s HR site.';
  }

  if (t.includes('1099-b')) {
    return 'For stocks, crypto, mutual funds, or other investment sales. Usually available from your brokerage tax documents section. Please upload the full consolidated 1099 if available.';
  }

  if (t.includes('1099-div')) {
    return 'For dividend income from stocks, funds, or brokerage accounts. Usually included in a consolidated 1099 from your brokerage or financial institution.';
  }

  if (t.includes('1099-int')) {
    return 'For interest income from banks, credit unions, savings accounts, CDs, TreasuryDirect, or other financial accounts. Usually available in your bank’s tax documents section.';
  }

  if (t.includes('1099-nec')) {
    return 'Usually sent by clients or platforms that paid you as a contractor. Check email, payment portals, or client tax document areas.';
  }

  if (t.includes('1099-k')) {
    return 'Usually available inside PayPal, Venmo, Stripe, Square, Cash App for Business, Etsy, eBay, or other payment platform tax document sections.';
  }

  if (t.includes('ssa-1099')) {
    return 'For Social Security benefits. You can usually download this from your Social Security online account or use the mailed copy if you received one.';
  }

  if (t.includes('1099-r')) {
    return 'For retirement, pension, IRA, annuity, or similar distributions. Usually available from your retirement account provider, pension administrator, IRA custodian, or plan website.';
  }

  if (t.includes('1099-g')) {
    return 'Often used for unemployment compensation or a state/local tax refund. Usually available from your state unemployment agency or state tax agency website.';
  }

  if (t.includes('rental income summary')) {
    return 'Upload a simple document or spreadsheet showing total rent received, rental expenses by category, property address, and any major repairs or improvements.<br><br><a href="https://calmtax.co/blog/business-expense-categories-guide" target="_blank" rel="noopener">View our business expense category guide</a>';
  }

  if (t.includes('business expense totals') || t.includes('total annual expense amount')) {
    return 'Please upload a spreadsheet or document showing your expense totals by category. If you're unsure how to categorize an expense, see our business expense category guide.<br><br><a href="https://calmtax.co/blog/business-expense-categories-guide" target="_blank" rel="noopener">View our business expense category guide</a>';
  }

  if ((t.includes('supplies') && t.includes('equipment') && t.includes('tools')) || (t.includes('total amount spent') && (t.includes('supplies') || t.includes('equipment') || t.includes('tools')))) {
    return 'Please provide totals by category rather than one combined number. For example: supplies total, equipment total, tools total, software total, and any large purchases listed separately with item, purchase date, cost, and date first used for work. If you're unsure where something belongs, see our business expense category guide.<br><br><a href="https://calmtax.co/blog/business-expense-categories-guide" target="_blank" rel="noopener">View our business expense category guide</a>';
  }

  if (t.includes('gross business income')) {
    return 'This means your total business income before subtracting expenses. You can upload a sales report, payment platform report, bookkeeping summary, or spreadsheet/document with your gross income total.';
  }

  if (t.includes('mileage')) {
    return 'Upload your mileage summary or log showing business miles, total miles, dates or date range, and how you tracked the mileage.';
  }

  if (t.includes('large business assets') || t.includes('equipment')) {
    return 'Examples include computers, cameras, furniture, tools, machinery, or other higher-cost items used for business. These may need special tax treatment or depreciation.';
  }

  if (t.includes('1095-a')) {
    return 'Download this from Healthcare.gov or your state Marketplace account. This is required if you had Marketplace insurance.';
  }

  if (t.includes('1098 mortgage')) {
    return 'Usually available from your mortgage lender online account or year-end statement.';
  }

  if (t.includes('1098-t')) {
    return 'Usually available from the school’s student account, bursar, or financial portal.';
  }

  if (t.includes('1098-e')) {
    return 'Usually available from your student loan servicer.';
  }

  if (t.includes('estimated tax')) {
    return 'Upload IRS/state confirmation emails, EFTPS confirmations, bank records, or a list of dates and amounts paid.';
  }

  if (t.includes('bank routing')) {
    return 'Upload a voided check or a typed note with routing number, account number, account type, and bank name.';
  }

  return '';
}

function uploadedFilesForIndex(idx) {
  return (state.uploadedFiles || []).filter(function (file) {
    return Number(file.checklistIndex) === Number(idx);
  });
}

function itemHtml(item, idx) {
  const tip = helpFor(item);
  const relatedFiles = uploadedFilesForIndex(idx);
  const isComplete = checked.has(idx) || relatedFiles.length > 0;
  const help = tip
    ? '<span class="help" tabindex="0" onclick="event.stopPropagation()">?<span class="tip">' + tip + '</span></span>'
    : '';

  const filesHtml = relatedFiles.length
    ? '<div class="row-files">' + relatedFiles.map(fileHtml).join('') + '</div>'
    : '';

  return (
    '<div class="item row-upload ' + (isComplete ? 'checked' : '') + '" data-idx="' + idx + '" ondragenter="rowDragEnter(event, ' + idx + ')" ondragover="rowDragOver(event, ' + idx + ')" ondragleave="rowDragLeave(event, ' + idx + ')" ondrop="rowDrop(event, ' + idx + ')">' +
      '<div class="item-main">' +
        '<div class="item-head">' +
          '<div class="check">✓</div>' +
          '<div><div class="label">' + esc(cleanItemLabel(item)) + help + '</div></div>' +
          '<div class="item-actions">' +
            '<button class="row-upload-btn" type="button" id="uploadBtn-' + idx + '" onclick="openRowFilePicker(' + idx + ', event)">Upload</button>' +
          '</div>' +
        '</div>' +
        '<div class="row-status" id="rowStatus-' + idx + '"></div>' +
        filesHtml +
        '<input class="hidden-row-file-input" type="file" id="rowFileInput-' + idx + '" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.txt,.rtf,.csv,.xls,.xlsx,.ods,.numbers" onchange="handleRowFileInput(' + idx + ', event)">' +
      '</div>' +
    '</div>'
  );
}

function fileHtml(file) {
  const id = esc(file.id || '');
  const name = esc(file.name || 'Uploaded file');
  const date = file.timestamp ? new Date(file.timestamp).toLocaleDateString() : '';

  return (
    '<div class="row-file">' +
      '<span class="row-file-name">📄 ' + name + (date ? ' <span style="opacity:.7;">(' + esc(date) + ')</span>' : '') + '</span>' +
      (id ? '<button class="delete-btn" onclick="deleteFile(\'' + id + '\', event)">Delete</button>' : '') +
    '</div>'
  );
}

function uploadTypeSelectHtml(items) {
  const options = (items || []).map(function (item, idx) {
    if (checked.has(idx)) return '';
    return '<option value="' + idx + '">' + esc(item) + '</option>';
  }).join('');

  return (
    '<div class="doc-select-wrap">' +
      '<select class="doc-select" id="uploadDocType" aria-label="Document type">' +
        '<option value="">Select document type (optional)</option>' +
        '<option value="other">Other Documents</option>' +
        options +
      '</select>' +
    '</div>'
  );
}

function selectedUploadLabel() {
  const select = document.getElementById('uploadDocType');
  if (!select || select.value === '') return '';
  if (select.value === 'other') return 'Other Documents';
  const idx = Number(select.value);
  const item = state && state.items ? state.items[idx] : '';
  return cleanItemLabel(item || '');
}

function cleanDocLabel(label) {
  return String(label || '')
    .replace(/[\\/:*?"<>|#%{}~&]/g, '-')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 80);
}


function setUploadMessage(type, message) {
  const status = document.getElementById('uploadStatus');
  if (!status) return;

  if (type === 'loading') {
    status.innerHTML = '<div class="upload-status-line"><span class="upload-spinner"></span><span>' + esc(message) + '</span></div>';
  } else if (type === 'success') {
    status.innerHTML = '<div class="upload-status-line"><span class="upload-check">✓</span><span>' + esc(message) + '</span></div>';
  } else if (type === 'error') {
    status.innerHTML = '<div class="upload-status-line"><span>⚠️</span><span>' + esc(message) + '</span></div>';
  } else {
    status.textContent = message;
  }
}


function resetUploadMessageSoon() {
  window.clearTimeout(window.uploadResetTimer);
  window.uploadResetTimer = window.setTimeout(function () {
    setUploadMessage('default', 'Optional: Select a document type to automatically mark a checklist item complete.');
    const progress = document.getElementById('uploadProgress');
    if (progress) progress.innerHTML = '';
  }, 4500);
}

function render() {
  if (!state) return;

  const items = state.items || [];
  const groups = {};

  items.forEach(function (item, idx) {
    const category = categoryFor(item);
    if (!groups[category]) groups[category] = [];
    groups[category].push({ item: item, idx: idx });
  });

  const order = [
    'Identity & Prior Return',
    'Income Documents',
    'Business & Deduction Records',
    'Deduction & Credit Records',
    'Other Tax Items',
    'Additional Documents'

    let group = groups[category];
    if (!group || !group.length) return;
    group = group.slice().sort(function (a, b) {
      return Number(checked.has(a.idx)) - Number(checked.has(b.idx));
    });
    checklistHtml += '<div class="group-title">' + category + '</div>' + group.map(function (row) {
      return itemHtml(row.item, row.idx);
    }).join('');
  });

  const files = (state.uploadedFiles || []).map(fileHtml).join('');
  const firstName = ((state.name || '').split(' ')[0] || 'there');

  document.getElementById('app').innerHTML =
    '<div class="brand">' +
      '<div>' +
        '<svg viewBox="15 22 390 108" fill="none" class="logo-svg" xmlns="http://www.w3.org/2000/svg">' +
          '<text x="46" y="92" font-family="Cormorant Garamond, Georgia, serif" font-size="96" font-weight="300" font-style="italic" fill="#2A2A2A">Calm</text>' +
          '<line x1="272" y1="38" x2="272" y2="100" stroke="#C4BDB3" stroke-width="1.6"></line>' +
          '<text x="288" y="65" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">TAX</text>' +
          '<text x="288" y="92" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">CO.</text>' +
          '<path d="m 18.361809,116.41876 q 94.000001,-12 196.000001,0 102,12 174,0" stroke="#9a9590" stroke-width="2.2" fill="none" stroke-linecap="round"></path>' +
        '</svg>' +
      '</div>' +
      '<div class="year"><div class="year-label">Tax Year</div><div class="year-num">2025</div></div>' +
    '</div>' +
    '<div class="journey">' +
      '<div class="journey-title">Your tax return progress</div>' +
      '<div class="journey-track">' +
        '<div class="journey-step done"><div class="journey-dot">1</div><span class="journey-label">Short Intake</span></div>' +
        '<div class="journey-step current"><div class="journey-dot">2</div><span class="journey-label">Gather &amp; Upload<br><span class="journey-note">You are here</span></span></div>' +
        '<div class="journey-step future"><div class="journey-dot">3</div><span class="journey-label">Quote &amp; Pay</span></div>' +
        '<div class="journey-step future"><div class="journey-dot">4</div><span class="journey-label">Prepare &amp; E-file</span></div>' +
      '</div>' +
    '<div class="title">Upload Your Documents</div>' +
    '<p class="intro">Thank you for completing your walkthrough, ' + esc(firstName) + '. This personalized checklist will help you gather the documents and information needed for your return. Upload what you already have, and you can come back later as you find more.</p>' +
    '</div>' +

    (state.hasItemizedDeductions ? '<div class="reminder">💡 <strong>Itemized deduction reminder:</strong> Because you selected possible itemized deductions, you do not need to track down every small receipt before getting started. The most helpful records are usually larger or official documents, such as mortgage interest statements, property tax records, larger charitable donation records, and significant medical expense records. Upload what you already have, and we will let you know if anything else is likely to help.</div>' : '') +
    '<div class="checklist-card">' +
      '<div class="checklist-card-title">Checklist</div>' +
      '<div class="checklist-legend">' +
        '<span class="legend-item"><span class="legend-circle complete">✓</span> Complete</span>' +
        '<span class="legend-item"><span class="legend-circle"></span> Not yet uploaded</span>' +
      '</div>' +
      '<div id="items">' + checklistHtml + '</div>' +
      '<div class="other-upload-row in-card" id="otherUploadRow" ondragenter="otherDragEnter(event)" ondragover="otherDragOver(event)" ondragleave="otherDragLeave(event)" ondrop="otherDrop(event)">' +
        '<h3>Other Documents</h3>' +
        '<p>Not sure where a file belongs? Upload it here.</p>' +
        '<button class="row-upload-btn" type="button" onclick="openOtherFilePicker(event)">Upload Other Documents</button>' +
        '<div class="row-status" id="otherStatus" style="justify-content:center;margin-left:0;"></div>' +
        '<input class="hidden-row-file-input" type="file" id="otherFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.txt,.rtf,.csv,.xls,.xlsx,.ods,.numbers" onchange="handleOtherFileInput(event)">' +
      '</div>' +
    '</div>' +
    '<div class="checklist-helper">Drag files directly onto a document row, or use the Upload button.</div>' +
    '<div class="privacy security-note"><span class="security-icon">◆</span><span><strong>Privacy &amp; security:</strong> Your tax documents are uploaded to your client folder in secure cloud storage. Access is limited to the people involved in preparing your return, and we never sell your information. Please use this upload page for tax documents instead of regular email.</span></div>' +
    '<div class="contact-card"><span class="contact-icon">✉</span><span>Questions? Feel free to reach out at <a href="mailto:hello@calmtax.co">hello@calmtax.co</a></span></div><div class="footer-note">© 2026 Calm Tax Co. All rights reserved.</div>';

  setupDropZone();

async function load() {
  try {
    if (!CLIENT_ID) throw new Error('Missing checklist link code.');
    state = await api({ form_type: 'getChecklist', clientId: CLIENT_ID });
    checked = new Set((state.checkedIndexes || []).map(Number));
    render();
  } catch (error) {
    document.getElementById('app').innerHTML = '<div class="err">' + esc(error.message) + '</div>';
  }
}

async function toggleItem(idx) {
  if (checked.has(idx)) checked.delete(idx);
  else checked.add(idx);
  render();

  try {
    await api({ form_type: 'saveChecklistState', clientId: CLIENT_ID, checkedIndexes: Array.from(checked) });
  } catch (error) {
    alert('Could not save checklist change: ' + error.message);
  }
}

function readFileAsDataURL(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(new Error('Could not read file.')); };
    reader.readAsDataURL(file);
  });
}

function setRowStatus(idx, type, message) {
  const el = document.getElementById(idx === 'other' ? 'otherStatus' : 'rowStatus-' + idx);
  if (!el) return;

  if (type === 'loading') {
    el.innerHTML = '<span class="mini-spinner"></span><span>' + esc(message) + '</span>';
  } else if (type === 'success') {
    el.innerHTML = '<span class="upload-check">✓</span><span>' + esc(message) + '</span>';
    window.setTimeout(function () {
      const fresh = document.getElementById(idx === 'other' ? 'otherStatus' : 'rowStatus-' + idx);
      if (fresh) fresh.innerHTML = '';
    }, 3500);
  } else if (type === 'error') {
    el.innerHTML = '<span>⚠️</span><span>' + esc(message) + '</span>';
  } else {
    el.textContent = message || '';
  }
}

function openRowFilePicker(idx, event) {
  if (event) event.stopPropagation();
  const input = document.getElementById('rowFileInput-' + idx);
  if (input) input.click();
}

function handleRowFileInput(idx, event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  if (!files.length) return;
  uploadFilesForChecklistItem(idx, files);
}

function rowDragEnter(event, idx) {
  event.preventDefault();
  event.stopPropagation();
  const row = event.currentTarget;
  if (row) row.classList.add('drag-over');
}

function rowDragOver(event, idx) {
  event.preventDefault();
  event.stopPropagation();
  const row = event.currentTarget;
  if (row) row.classList.add('drag-over');
}

function rowDragLeave(event, idx) {
  event.preventDefault();
  event.stopPropagation();
  const row = event.currentTarget;
  if (!row || row.contains(event.relatedTarget)) return;
  row.classList.remove('drag-over');
}

function rowDrop(event, idx) {
  event.preventDefault();
  event.stopPropagation();
  const row = event.currentTarget;
  if (row) row.classList.remove('drag-over');
  const files = Array.from(event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files : []);
  if (!files.length) return;
  uploadFilesForChecklistItem(idx, files);
}

function openOtherFilePicker(event) {
  if (event) event.stopPropagation();
  const input = document.getElementById('otherFileInput');
  if (input) input.click();
}

function handleOtherFileInput(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  if (!files.length) return;
  uploadFilesAsOther(files);
}

function otherDragEnter(event) {
  event.preventDefault();
  event.stopPropagation();
  document.getElementById('otherUploadRow').classList.add('drag-over');
}

function otherDragOver(event) {
  event.preventDefault();
  event.stopPropagation();
  document.getElementById('otherUploadRow').classList.add('drag-over');
}

function otherDragLeave(event) {
  event.preventDefault();
  event.stopPropagation();
  const row = document.getElementById('otherUploadRow');
  if (!row || row.contains(event.relatedTarget)) return;
  row.classList.remove('drag-over');
}

function otherDrop(event) {
  event.preventDefault();
  event.stopPropagation();
  const row = document.getElementById('otherUploadRow');
  if (row) row.classList.remove('drag-over');
  const files = Array.from(event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files : []);
  if (!files.length) return;
  uploadFilesAsOther(files);
}

function selectedLabelForIndex(idx) {
  return state && state.items && state.items[idx] ? cleanItemLabel(state.items[idx]) : '';
}

async function uploadFilesForChecklistItem(idx, files) {
  const button = document.getElementById('uploadBtn-' + idx);
  if (button) button.disabled = true;

  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const countText = files.length > 1 ? 'Uploading ' + (i + 1) + ' of ' + files.length + ': ' + file.name : 'Uploading ' + file.name;
      setRowStatus(idx, 'loading', countText);

      const dataUrl = await readFileAsDataURL(file);
      const label = selectedLabelForIndex(idx);
      const cleanLabel = cleanDocLabel(label);

      const result = await api({
        form_type: 'uploadFile',
        clientId: CLIENT_ID,
        file: {
          name: file.name,
          mimeType: file.type,
          dataUrl: dataUrl,
          docType: label,
          docTypeLabel: cleanLabel,
          checklistIndex: idx
        }
      });

      if (!state.uploadedFiles) state.uploadedFiles = [];
      state.uploadedFiles.push({
        name: result.fileName || file.name,
        id: result.fileId || '',
        timestamp: new Date().toISOString(),
        checklistIndex: idx,
        docTypeLabel: cleanLabel
      });
    }

    checked.add(Number(idx));
    await api({ form_type: 'saveChecklistState', clientId: CLIENT_ID, checkedIndexes: Array.from(checked) });
    render();
    setRowStatus(idx, 'success', files.length > 1 ? files.length + ' files uploaded.' : 'Upload complete.');
  } catch (error) {
    alert('Upload failed: ' + error.message);
    setRowStatus(idx, 'error', 'Upload failed. Please try again.');
  } finally {
    const freshButton = document.getElementById('uploadBtn-' + idx);
    if (freshButton) freshButton.disabled = false;
  }
}

async function uploadFilesAsOther(files) {
  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const countText = files.length > 1 ? 'Uploading ' + (i + 1) + ' of ' + files.length + ': ' + file.name : 'Uploading ' + file.name;
      setRowStatus('other', 'loading', countText);

      const dataUrl = await readFileAsDataURL(file);
      const result = await api({
        form_type: 'uploadFile',
        clientId: CLIENT_ID,
        file: {
          name: file.name,
          mimeType: file.type,
          dataUrl: dataUrl,
          docType: 'Other Documents',
          docTypeLabel: 'Other Documents',
          checklistIndex: ''
        }
      });

      if (!state.uploadedFiles) state.uploadedFiles = [];
      state.uploadedFiles.push({
        name: result.fileName || file.name,
        id: result.fileId || '',
        timestamp: new Date().toISOString(),
        checklistIndex: '',
        docTypeLabel: 'Other Documents'
      });
    }

    render();
    setRowStatus('other', 'success', files.length > 1 ? files.length + ' files uploaded.' : 'Upload complete.');
  } catch (error) {
    alert('Upload failed: ' + error.message);
    setRowStatus('other', 'error', 'Upload failed. Please try again.');
  }
}


async function deleteFile(fileId, event) {
  event.stopPropagation();

  if (!fileId) return;
  if (!confirm('Delete this uploaded file?')) return;

  const button = event.currentTarget;
  const row = button ? button.closest('.row-file, .file') : null;
  const originalButtonHtml = button ? button.innerHTML : '';
  const fileRecord = (state.uploadedFiles || []).find(function (file) {
    return String(file.id) === String(fileId);
  });
  const deletedIndex = fileRecord && fileRecord.checklistIndex !== undefined && fileRecord.checklistIndex !== '' ? Number(fileRecord.checklistIndex) : null;

  if (row) row.classList.add('deleting');
  if (button) {
    button.disabled = true;
    button.innerHTML = '<span class="mini-spinner"></span>Deleting...';
  }

  try {
    await api({ form_type: 'deleteFile', clientId: CLIENT_ID, fileId: fileId });
    state.uploadedFiles = (state.uploadedFiles || []).filter(function (file) {
      return file.id !== fileId;
    });

    if (deletedIndex !== null && !Number.isNaN(deletedIndex)) {
      const stillHasFiles = state.uploadedFiles.some(function (file) {
        return Number(file.checklistIndex) === Number(deletedIndex);
      });
      if (!stillHasFiles) {
        checked.delete(deletedIndex);
        await api({ form_type: 'saveChecklistState', clientId: CLIENT_ID, checkedIndexes: Array.from(checked) });
      }
    }

    render();
  } catch (error) {
    if (row) row.classList.remove('deleting');
    if (button) {
      button.disabled = false;
      button.innerHTML = originalButtonHtml || 'Delete';
    }
    alert('Could not delete file: ' + error.message);
  }
}


function setupDropZone() {
  const dropZone = document.getElementById('dropZone');
  if (!dropZone) return;

  ['dragenter', 'dragover'].forEach(function (eventName) {
    dropZone.addEventListener(eventName, function (event) {
      event.preventDefault();
      event.stopPropagation();
      dropZone.classList.add('drag-over');
    });
  });

  ['dragleave', 'drop'].forEach(function (eventName) {
    dropZone.addEventListener(eventName, function (event) {
      event.preventDefault();
      event.stopPropagation();
      dropZone.classList.remove('drag-over');
    });
  });

  dropZone.addEventListener('drop', function (event) {
    const files = Array.from(event.dataTransfer && event.dataTransfer.files ? event.dataTransfer.files : []);
    if (!files.length) return;
    uploadSelectedFiles(files);
  });
}


load();
