<style>
:root{--bg:#faf8f5;--bg2:#f4f1ea;--white:#fff;--ink:#3C3633;--mid:#4A545C;--sage:#7D8E7E;--border:rgba(60,54,51,.12);--success:#2e7d32;--danger:#8a3434;--warn:#8a6a24;--r:14px;--rl:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:980px;margin:0 auto;padding:32px 18px 80px}.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:30px;gap:16px}.logo-svg{width:260px;max-width:58vw;height:auto;display:block}.year{text-align:right}.year-label{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--mid);opacity:.65}.year-num{font-family:Lora,serif;font-size:34px}.journey{margin:28px 0 12px;padding:18px 18px 38px}.journey-title{text-align:center;font-family:Lora,serif;font-size:21px;font-style:italic;margin:0 0 18px}.journey-track{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}.journey-track:before{content:"";position:absolute;left:12%;right:12%;top:19px;height:1.5px;border-top:2px dashed rgba(125,142,126,.28);z-index:0}.journey-step{position:relative;z-index:1;flex:1;text-align:center;color:var(--mid)}.journey-dot{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:Lora,serif;font-size:15px;box-shadow:0 0 0 7px var(--bg),0 2px 8px rgba(60,54,51,.06);margin-bottom:9px}.journey-label{display:block;font-family:Lora,serif;font-size:16px;line-height:1.35;font-weight:500;color:var(--ink)}.journey-step.done .journey-dot,.journey-step.current .journey-dot{background:var(--sage);border-color:var(--sage);color:#fff}.journey-step.current .journey-dot{transform:scale(1.08)}.journey-note{display:block;width:max-content;margin:7px auto 0;padding:4px 10px;border-radius:999px;background:rgba(125,142,126,.12);color:var(--sage);font-family:Inter,sans-serif;font-size:11px;font-weight:600}.title{text-align:center;font-family:Lora,serif;font-style:italic;font-size:44px;line-height:1.1;font-weight:400;margin:26px 0 16px;border-top:1px solid var(--border);padding-top:24px}.intro{text-align:center;max-width:780px;margin:0 auto 30px;font-family:Lora,serif;font-size:17px;line-height:1.65;color:var(--mid)}.checklist-subheading{display:block;font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);font-size:24px;font-style:italic;font-weight:300;letter-spacing:.01em;margin:12px 0 2px}.intro{font-family:Inter,sans-serif;color:var(--ink);font-size:15px;line-height:1.7}.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:0 4px 16px rgba(60,54,51,.035);padding:28px;margin:22px 0}.card h2,.card-title{font-family:Lora,serif;font-size:26px;font-weight:500;margin:0 0 10px}.card p{font-size:15px;line-height:1.65;color:var(--mid);margin:0 0 14px}.btn{font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:var(--ink);border:0;border-radius:999px;padding:13px 22px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:var(--sage)}.return-ready{border-color:rgba(125,142,126,.32);background:linear-gradient(180deg,#fff,rgba(125,142,126,.045))}.return-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:20px 0 8px}.return-actions .btn{width:100%}.return-note{border-left:4px solid var(--sage);background:var(--bg2);border-radius:0 12px 12px 0;padding:14px 16px 14px 20px;font-size:14px;line-height:1.6;color:var(--mid);margin-top:18px}.return-steps{display:grid;gap:9px;margin:18px 0 8px;padding:14px;border:1px solid rgba(125,142,126,.22);border-radius:14px;background:rgba(255,255,255,.62)}.return-step{display:flex;gap:10px;align-items:flex-start;color:var(--mid);font-size:14px;line-height:1.45}.return-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--sage);color:transparent;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}.return-step.done .return-check{background:var(--sage);color:#fff}.return-step.done{color:var(--ink)}.efile-status{display:inline-block;margin:0 0 14px;padding:5px 11px;border-radius:999px;background:rgba(125,142,126,.12);color:var(--sage);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.privacy{border-left:4px solid var(--sage);background:var(--bg2);border-radius:0 var(--r) var(--r) 0;padding:16px 18px 16px 24px;font-size:14px;line-height:1.65;color:var(--mid);margin:22px 0}.lock-note{border-left-color:#d6aa4d;background:#fff8ea;color:var(--warn)}.group-title{font-family:Lora,serif;font-size:23px;margin:30px 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px}.item{display:flex;gap:12px;align-items:flex-start;padding:13px 10px;border-bottom:1px solid rgba(60,54,51,.07);border-radius:8px}.item.row-upload{align-items:stretch;cursor:default;background:#fff;border:1px solid rgba(60,54,51,.08);margin-bottom:8px;transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease}.item.row-upload.drag-over,.other-upload-row.drag-over{background:#fff;border-color:var(--sage);box-shadow:0 8px 22px rgba(60,54,51,.08);transform:translateY(-1px)}.item-main{flex:1;min-width:0}.item-head{display:flex;gap:12px;align-items:flex-start}.item-actions{display:flex;align-items:flex-start;justify-content:flex-end;gap:8px;margin-left:auto;padding-left:10px}.row-upload-btn{border:1px solid rgba(125,142,126,.36);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}.row-upload-btn:hover{background:rgba(125,142,126,.10)}.row-upload-btn[disabled]{opacity:.65;cursor:wait}.row-files{margin:10px 0 0 34px;display:flex;flex-direction:column;gap:6px}.row-file{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--border);background:#fafafa;border-radius:9px;padding:8px 10px;font-size:13px;color:var(--mid)}.row-file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-status{margin:8px 0 0 34px;font-size:13px;color:var(--mid);display:flex;align-items:center;gap:8px}.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sage);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;color:transparent}.checked .check{background:var(--sage);color:#fff}.checked .label{text-decoration:line-through}.label{font-size:15px;line-height:1.45;font-weight:500}.help{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--sage);color:var(--sage);font-size:12px;cursor:help;vertical-align:middle;text-decoration:none}.tip{display:none;position:absolute;left:22px;top:-10px;z-index:20;width:min(380px,78vw);background:#fff;border:1px solid var(--border);box-shadow:0 8px 20px rgba(60,54,51,.14);border-radius:10px;padding:12px;text-align:left;color:var(--ink);font-size:13px;line-height:1.45;font-weight:400;text-decoration:none}.help:hover .tip,.help:focus .tip,.tip:hover{display:block}.tip a{color:var(--sage);font-weight:600;text-decoration:underline}.delete-btn{border:1px solid #e4b6b6;background:#fff5f5;color:#8a3434;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:12px}.delete-btn:hover{background:#ffecec}.delete-btn[disabled]{opacity:.7;cursor:wait}.delete-confirm{width:100%;margin-top:8px;padding:10px 12px;border:1px solid #e4c6c6;border-radius:10px;background:#fff7f7;color:var(--ink);font-size:13px;line-height:1.45}.delete-confirm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.delete-confirm-cancel,.delete-confirm-ok{border-radius:999px;padding:7px 12px;font-family:Inter,sans-serif;font-size:12px;font-weight:600;cursor:pointer}.delete-confirm-cancel{border:1px solid var(--border);background:#fff;color:var(--ink)}.delete-confirm-ok{border:1px solid #d39b9b;background:#8a3434;color:#fff}.row-file.confirming-delete{flex-wrap:wrap}.other-upload-row{margin-top:18px;border:1px dashed rgba(125,142,126,.45);background:rgba(125,142,126,.05);border-radius:14px;padding:16px;text-align:center;transition:background .16s ease,border-color .16s ease,transform .16s ease}.other-upload-row h3{font-family:Lora,serif;font-size:20px;margin:0 0 5px}.other-upload-row p{margin:0 0 12px;font-size:13px;color:var(--mid);line-height:1.5}.hidden-row-file-input,input[type=file]{display:none}.checklist-helper{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--mid);font-size:13px;margin:18px 0}.progress-pill{display:inline-flex;align-items:center;justify-content:center;width:fit-content;margin:6px 0 18px;padding:7px 13px;border-radius:999px;background:rgba(125,142,126,.12);color:var(--sage);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.upload-spinner,.mini-spinner{border-radius:50%;border:3px solid rgba(125,142,126,.22);border-top-color:var(--sage);animation:spin .8s linear infinite}.mini-spinner{width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px;margin-right:6px}.upload-check{width:20px;height:20px;border-radius:50%;background:var(--success);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}@keyframes spin{to{transform:rotate(360deg)}}.contact-card{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px auto 0;padding:18px 20px;max-width:680px;border:1px solid rgba(125,142,126,.20);border-radius:16px;background:rgba(255,255,255,.58);color:var(--mid);font-size:14px;line-height:1.5;text-align:center}.contact-icon{width:34px;height:34px;border-radius:50%;background:rgba(125,142,126,.12);color:var(--sage);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px}.contact-card a{color:var(--sage);font-weight:600;text-decoration:none}.contact-email{font-family:"Cormorant Garamond",Georgia,serif!important;font-style:italic;font-size:1.18em;font-weight:500;letter-spacing:.01em}.footer-note{text-align:center;color:rgba(74,84,92,.72);font-size:12px;margin:26px 0 0}.loading{text-align:center;padding:70px 20px;color:var(--mid);font-family:Lora,serif;font-size:20px}.err{background:#fff0f0;border:1px solid #f2c1c1;color:#7a2828;padding:14px;border-radius:12px}.file.deleting{opacity:.7;background:#fafafa}@media(max-width:700px){.brand{align-items:flex-start}.logo-svg{width:210px}.year-num{font-size:28px}.title{font-size:34px}.journey{padding-left:6px;padding-right:6px}.journey-track{gap:4px}.journey-track:before{top:16px;left:12%;right:12%}.journey-dot{width:34px;height:34px;font-size:13px}.journey-label{font-size:14px}.card{padding:20px}.item.row-upload{flex-direction:column}.item-head{width:100%}.item-actions{margin-left:34px;padding-left:0;justify-content:flex-start}.row-files,.row-status{margin-left:34px}.contact-card{align-items:flex-start;text-align:left}}

<div class="wrap"><div id="app"><div class="loading">Loading your checklist…</div></div></div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbxIqzdrwed8JgxdUUMMtTqVUQDmEmChlm7411oMGUUAF4Jn_8HinPHNDmNwZKb6vddiXg/exec';
const params=new URLSearchParams(location.search);
const CLIENT_ID=params.get('c')||params.get('checklist');
const EXPENSE_GUIDE_URL='https://calmtax.co/blog/business-expense-categories-guide';
let state=null;
let checked=new Set();
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
async function api(payload){const controller=new AbortController();const timeoutId=setTimeout(function(){controller.abort();},payload&&payload.form_type==='uploadFile'?120000:30000);let response;try{response=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:controller.signal});}catch(error){if(error&&error.name==='AbortError')throw new Error('The server took too long to respond. Please refresh and try again.');throw error;}finally{clearTimeout(timeoutId);}const text=await response.text();let data;try{data=JSON.parse(text);}catch(error){throw new Error('Unexpected server response.');}if(!data||data.status==='error')throw new Error(data&&data.message?data.message:'Request failed.');return data;}
function cleanItemLabel(value){let text=String(value||'').replace(/^•\s*/,'').trim();const lower=text.toLowerCase();if(lower.includes('phone')&&lower.includes('internet')&&lower.includes('business-use percentage'))return 'Total annual cost(s) of phone and/or internet';if((lower.includes('supplies')&&lower.includes('equipment')&&lower.includes('tools'))||(lower.includes('total amount spent')&&(lower.includes('supplies')||lower.includes('equipment')||lower.includes('tools'))))return 'Supplies, equipment, and tools purchased for work — provide totals by category';if(lower.includes('business expense totals')||lower.includes('total annual expense amount'))return 'Business expense totals by category';if(lower.includes('cost of goods')||lower.includes('inventory'))return 'Inventory $ values and inventory purchase total';if(lower.includes('rental expense'))return 'Rental expense totals by category';return text.replace(/\s*\(secure upload only\)\s*/gi,'').replace(/\s*\(provide only through your secure upload page\s*—\s*do not email it\)\s*/gi,'').replace(/\s*\(provide only through your secure upload folder\s*—\s*do not email it\)\s*/gi,'').replace(/\s*\(do not email it\)\s*/gi,'');}
function categoryFor(item){const t=String(item||'').toLowerCase();if(t.includes('ssn')||t.includes('itin')||t.includes('prior year'))return 'Identity & Prior Return';if(t.includes('w-2')||t.includes('1099')||t.includes('income')||t.includes('sales report')||t.includes('ssa-')||t.includes('unemployment')||t.includes('rental income summary')||t.includes('scholarship')||t.includes('grant information'))return 'Income Documents';if(t.includes('business')||t.includes('expense totals')||t.includes('rental expense')||t.includes('rental property purchased')||((t.includes('closing disclosure')||t.includes('settlement statement'))&&t.includes('rental property'))||t.includes('mileage')||t.includes('vehicle')||t.includes('equipment')||t.includes('cost of goods')||t.includes('inventory')||t.includes('contractors')||t.includes('home office')||t.includes('square footage')||t.includes('phone')||t.includes('internet'))return 'Business & Deduction Records';if(t.includes('mortgage')||t.includes('property tax')||t.includes('charitable')||t.includes('medical')||t.includes('health insurance')||t.includes('premium')||t.includes('childcare')||t.includes('student')||t.includes('tuition')||t.includes('1098-e')||t.includes('1098-t')||t.includes('ira')||t.includes('adoption')||t.includes('energy')||t.includes('ev purchase')||t.includes('1095-a')||t.includes('marketplace')||t.includes('hsa')||t.includes('1099-sa')||t.includes('5498-sa')||t.includes('alimony')||t.includes('home sale')||t.includes('1099-s')||t.includes('major home improvements'))return 'Personal Deductions & Credits';if(t.includes('bank routing')||t.includes('irs notice')||t.includes('state tax notice')||t.includes('estimated tax')||t.includes('closing disclosure')||t.includes('settlement statement'))return 'Other Tax Items';return 'Additional Documents';}
function itemizedTip(){return 'This may only help if your total itemized deductions are large. Don’t stress about every tiny amount. Upload what you already have and we’ll let you know if anything else is likely to help.';}
function helpFor(item){const raw=String(item||'');const t=raw.toLowerCase();if(t.includes('ssn')||t.includes('itin'))return 'If this number already appears on another uploaded tax form, such as a W-2, you do not need a separate document.';if(t.includes('prior year return'))return 'Upload last year’s federal and state tax returns if you have them.';if(t.includes('w-2'))return 'Usually available from your employer or payroll portal, such as ADP, Gusto, Workday, Paychex, or your employer’s HR site.';if(t.includes('1099s issued to contractors')||t.includes('1099-nec issued to contractors'))return 'Only needed if you paid contractors for your business and were required to issue Form 1099-NEC.';if(t.includes('1099-b'))return 'Usually available from your brokerage account. It reports investment sales, including stock, mutual fund, ETF, and sometimes crypto sales.';if(t.includes('1099-div'))return 'Usually available from your brokerage account or investment company. It reports dividend income.';if(t.includes('1099-int'))return 'Usually available from your bank, credit union, brokerage account, CD account, or online banking tax document section.';if(t.includes('1099-g'))return 'Usually available from your state unemployment agency or state tax department website. It may report unemployment income or a state tax refund.';if(t.includes('1099-r'))return 'Usually issued by pension providers, retirement accounts, IRA custodians, and annuity companies.';if(t.includes('ssa-1099'))return 'Usually mailed by Social Security or available in your Social Security online account.';if(t.includes('rental income summary'))return 'A simple spreadsheet showing total rent received during the year is usually sufficient. If you use bookkeeping software or a property management system, you may upload an annual income report instead.';if(t.includes('rental expense'))return 'Provide rental expense totals by category. Common categories include mortgage interest, property taxes, insurance, repairs, maintenance, utilities, HOA dues, management fees, supplies, advertising, and other rental expenses. A simple spreadsheet showing annual totals is usually sufficient.';if(t.includes('rental property purchased')||((t.includes('closing disclosure')||t.includes('settlement statement'))&&t.includes('rental property')))return 'If you purchased a rental property during the year, upload your Closing Disclosure (or HUD-1 if applicable). This helps establish your tax basis and depreciation.';if(t.includes('scholarship')||t.includes('grant information'))return 'Usually available from your college financial aid office, student portal, or Form 1098-T details.';if(t.includes('1098 mortgage')||t.includes('mortgage interest'))return 'Usually available from the mortgage lender for your primary home. '+itemizedTip();if(t.includes('property tax'))return 'Usually available from your county treasurer, assessor, escrow statement, or property tax bill/payment record. '+itemizedTip();if(t.includes('charitable'))return 'Upload donation receipts or year-end giving statements if you have them. '+itemizedTip();if(t.includes('medical'))return 'Small medical expenses are not likely to affect your return. Upload what you already have, especially larger expenses, and we’ll let you know if anything further is needed.';if(t.includes('health insurance')||t.includes('premium'))return 'Upload annual premium totals or statements if available. We will review whether they affect your return.';if(t.includes('1098-e')||t.includes('student loan interest'))return 'Usually available from your student loan servicer. This can help even if you do not itemize deductions.';if(t.includes('1098-t')||t.includes('tuition')||t.includes('college/training'))return 'Usually available through your college, training program, bursar, or student portal.';if(t.includes('ira contribution')||t.includes('form 5498'))return 'Usually available from the bank, brokerage, or retirement account provider where you made the IRA contribution. Form 5498 may arrive after tax season, so upload any confirmation you have.';if(t.includes('ev purchase')||t.includes('energy upgrade')||t.includes('energy credit')||t.includes('solar')||t.includes('battery')||t.includes('heat pump'))return 'Upload vehicle purchase paperwork or energy-efficiency upgrade receipts/certifications, such as solar, batteries, heat pumps, qualifying windows, doors, insulation, or similar improvements.';if(t.includes('1095-a')||t.includes('marketplace'))return 'Required if you had Marketplace health insurance. Download it from Healthcare.gov or your state Marketplace account.';if(t.includes('hsa')||t.includes('1099-sa')||t.includes('5498-sa'))return 'Usually provided by the bank or administrator that manages your HSA. Upload Form 1099-SA and/or 5498-SA if you received them.';if(t.includes('home office')||t.includes('square footage'))return 'Needed only if you use part of your home regularly and exclusively for business. Upload the business-use area and total home square footage.';if(t.includes('cost of goods')||t.includes('inventory'))return 'If you sell physical products, upload the $ value of your inventory on Jan 1, the $ value of your inventory on Dec 31, and your inventory purchase total for the year, if available.';if(t.includes('business expense totals')||t.includes('total annual expense amount')||t.includes('supplies')||t.includes('equipment')||t.includes('tools'))return 'Please upload totals by category rather than individual receipts. <br><br><a href="'+EXPENSE_GUIDE_URL+'" target="_blank" rel="noopener">View our business expense category guide</a>.';if(t.includes('form 1099-s')||t.includes('major home improvements'))return 'If you sold your home during the year, upload your Closing Disclosure (or settlement statement), Form 1099-S if you received one, and records of major improvements if available. These help determine any taxable gain and any applicable home sale exclusion.';if(t.includes('estimated tax'))return 'Upload IRS/state confirmation emails, EFTPS confirmations, bank records, or a list of dates and amounts paid.';if(t.includes('bank routing'))return 'Upload a voided check or typed note through this secure page. Do not email banking information.';return '';}
function logo(){return '<svg viewBox="15 22 390 108" fill="none" class="logo-svg" xmlns="http://www.w3.org/2000/svg"><text x="46" y="92" font-family="Cormorant Garamond, Georgia, serif" font-size="96" font-weight="300" font-style="italic" fill="#2A2A2A">Calm</text><line x1="272" y1="38" x2="272" y2="100" stroke="#C4BDB3" stroke-width="1.6"></line><text x="288" y="65" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">TAX</text><text x="288" y="92" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">CO.</text><path d="m 18.361809,116.41876 q 94.000001,-12 196.000001,0 102,12 174,0" stroke="#9a9590" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>';}
function progressStage(){const rr=state&&state.returnReview?state.returnReview:{};if(rr.isReturnReady)return 'return';if(String(state.paymentStatus||'').toLowerCase()==='paid')return 'paid';return 'docs';}
function journeyHtml(){const stage=progressStage();const step2=stage==='docs'?'current':'done';const step3=stage==='paid'||stage==='return'?'done':'future';const step4=stage==='return'?'current':'future';return '<div class="journey"><div class="journey-title">Your tax return progress</div><div class="journey-track"><div class="journey-step done"><div class="journey-dot">✓</div><span class="journey-label">Short Intake</span></div><div class="journey-step '+step2+'"><div class="journey-dot">'+(step2==='done'?'✓':'2')+'</div><span class="journey-label">Gather &amp; Upload'+(step2==='current'?'<br><span class="journey-note">You are here</span>':'')+'</span></div><div class="journey-step '+step3+'"><div class="journey-dot">'+(step3==='done'?'✓':'3')+'</div><span class="journey-label">Quote &amp; Pay</span></div><div class="journey-step '+step4+'"><div class="journey-dot">4</div><span class="journey-label">Prepare &amp; E-file'+(step4==='current'?'<br><span class="journey-note">You are here</span>':'')+'</span></div></div></div>';}
function uploadedFilesForIndex(idx){return(state.uploadedFiles||[]).filter(function(file){return Number(file.checklistIndex)===Number(idx);});}
function clientDisplayFileName(file){const stored=String((file&&file.name)||'').trim();const docLabel=String((file&&(file.docTypeLabel||file.docType))||'').trim();if(!stored)return '';if(docLabel){const prefix=docLabel+' - ';if(stored.toLowerCase().startsWith(prefix.toLowerCase()))return stored.slice(prefix.length).trim();}return stored;}
function fileHtml(file){const id=esc(file.id||'');const name=esc(clientDisplayFileName(file)||'Uploaded file');const date=file.timestamp?new Date(file.timestamp).toLocaleDateString():'';const canDelete=state.canDeleteFiles!==false;return '<div class="row-file"><span class="row-file-name">📄 '+name+(date?' <span style="opacity:.7;">('+esc(date)+')</span>':'')+'</span>'+(id&&canDelete?'<button class="delete-btn" onclick="deleteFile(\''+id+'\',event)">Delete</button>':'')+'</div>';}
function itemHtml(item,idx){const tip=helpFor(item);const files=uploadedFilesForIndex(idx);const isComplete=checked.has(idx);const help=tip?'<span class="help" tabindex="0" onclick="event.stopPropagation()">?<span class="tip">'+tip+'</span></span>':'';return '<div class="item row-upload '+(isComplete?'checked':'')+'" data-idx="'+idx+'" ondragenter="rowDragEnter(event,'+idx+')" ondragover="rowDragOver(event,'+idx+')" ondragleave="rowDragLeave(event,'+idx+')" ondrop="rowDrop(event,'+idx+')"><div class="item-main"><div class="item-head"><div class="check" role="button" tabindex="0" title="Check off this item" onclick="toggleChecklistItem('+idx+',event)">✓</div><div><div class="label" onclick="toggleChecklistItem('+idx+',event)">'+esc(cleanItemLabel(item))+help+'</div></div><div class="item-actions"><button class="row-upload-btn" type="button" id="uploadBtn-'+idx+'" onclick="openRowFilePicker('+idx+',event)">Upload</button></div></div><div class="row-status" id="rowStatus-'+idx+'"></div>'+(files.length?'<div class="row-files">'+files.map(fileHtml).join('')+'</div>':'')+'<input class="hidden-row-file-input" type="file" id="rowFileInput-'+idx+'" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.txt,.rtf,.csv,.xls,.xlsx,.ods,.numbers" onchange="handleRowFileInput('+idx+',event)"></div></div>';}
function returnReviewHtml(){const rr=state.returnReview||{};if(!rr.isReturnReady)return '';const links=rr.links||[];const authReceived=String(rr.form8879Received||'').trim().toLowerCase()==='yes'||String(rr.form8879Received||'').trim().toLowerCase()==='received'||String(rr.form8879Received||'').trim().toLowerCase()==='true';let linkHtml=links.map(function(link){return '<a class="btn" href="'+esc(link.url)+'" target="_blank" rel="noopener">'+esc(link.label)+'</a>';}).join('');if(!linkHtml)linkHtml='<div class="return-note">Your return is marked ready, but download links are not available yet.</div>';let status='Awaiting Review & Signature';if(authReceived)status='Authorization Received';if(String(rr.efileDate||'').trim())status='Return Filed';const stepClass=authReceived?' done':'';return '<div class="card return-ready"><span class="efile-status">'+esc(status)+'</span><h2>Your Return Is Ready</h2><p>Your return is ready for review. Please download and review the documents below. If everything looks correct, sign Form 8879 and upload the signed copy using the <strong>Other Documents</strong> section further down this page.</p><div class="return-actions">'+linkHtml+'</div><div class="return-steps"><div class="return-step done"><span class="return-check">✓</span><span>Review your return documents.</span></div><div class="return-step'+stepClass+'"><span class="return-check">✓</span><span>Sign Form 8879.</span></div><div class="return-step'+stepClass+'"><span class="return-check">✓</span><span>Upload the signed Form 8879 under <strong>Other Documents</strong>.</span></div></div><div class="return-note">Once your signed authorization is received, we will electronically file your return and send a confirmation email. We will not e-file until the required authorization has been completed.</div></div>';}
function cleanDocLabel(label){return String(label||'').replace(/[\\/:*?"<>|#%{}~&]/g,'-').replace(/\s+/g,' ').trim().slice(0,80);}
function selectedLabelForIndex(idx){return state&&state.items&&state.items[idx]?cleanItemLabel(state.items[idx]):'';}
function render(){if(!state)return;const items=state.items||[];const groups={};items.forEach(function(item,idx){const c=categoryFor(item);if(!groups[c])groups[c]=[];groups[c].push({item:item,idx:idx});});const order=['Identity & Prior Return','Income Documents','Business & Deduction Records','Personal Deductions & Credits','Other Tax Items','Additional Documents'];let checklistHtml='';order.forEach(function(cat){let group=groups[cat];if(!group||!group.length)return;group=group.slice().sort(function(a,b){return Number(checked.has(a.idx))-Number(checked.has(b.idx));});checklistHtml+='<div class="group-title">'+esc(cat)+'</div>'+group.map(function(row){return itemHtml(row.item,row.idx);}).join('');});const firstName=((state.name||'').split(' ')[0]||'there');const otherFiles=(state.uploadedFiles||[]).filter(function(f){return f.checklistIndex===''||f.checklistIndex===null||f.checklistIndex===undefined;}).map(fileHtml).join('');document.getElementById('app').innerHTML='<div class="brand"><div>'+logo()+'</div><div class="year"><div class="year-label">Tax Year</div><div class="year-num">2025</div></div></div>'+journeyHtml()+'<h1 class="title">Upload Documents<br>&amp; Checklist</h1><p class="intro"><strong>Hi '+esc(firstName)+', your personalized checklist is below.</strong><br>Upload what you already have, and you can come back later as you find more.<br><br><span class="checklist-subheading">Returning later?</span>We’ve emailed you a link to this page so you can easily return at any time. If you don’t see it within a few minutes, please check your spam or junk folder, and consider adding hello@calmtax.co to your contacts.<br><br><span class="checklist-subheading">What happens next?</span>Once you’ve uploaded your documents, we’ll review everything and email you your personalized quote.<br>After you’ve approved your quote and payment has been received, we’ll get started on preparing your return.</p><div class="privacy"><strong>Privacy &amp; security:</strong> Use this secure upload page for tax documents and personal information. Please do not email Social Security numbers, banking details, or tax documents.</div>'+(state.uploadsLockedMessage?'<div class="privacy lock-note"><strong>Uploads locked:</strong> '+esc(state.uploadsLockedMessage)+'</div>':'')+returnReviewHtml()+'<div class="card"><h2 style="text-align:center;">Checklist</h2><div class="progress-pill" style="display:flex;margin:0 auto 18px;">'+completedCount()+' of '+items.length+' completed</div><p>Drag files directly onto a document row, or use the Upload button. Uploading a file will automatically check off that item, and you can manually check or uncheck items anytime.</p><div id="checklistList">'+(checklistHtml||'<p>No checklist items found. Please contact us if you think this is an error.</p>')+'</div><div class="other-upload-row" id="otherUploadRow" ondragenter="otherDragEnter(event)" ondragover="otherDragOver(event)" ondragleave="otherDragLeave(event)" ondrop="otherDrop(event)"><h3>Other Documents</h3><p>Use this for anything that does not clearly match a checklist row.</p><button class="btn" type="button" onclick="openOtherFilePicker(event)">Upload Other Documents</button><input class="hidden-row-file-input" type="file" id="otherFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.txt,.rtf,.csv,.xls,.xlsx,.ods,.numbers" onchange="handleOtherFileInput(event)"><div class="row-status" id="rowStatus-other"></div>'+(otherFiles?'<div class="row-files" style="margin-left:0;margin-top:12px">'+otherFiles+'</div>':'')+'</div></div><div class="contact-card"><span class="contact-icon">✉</span><span>Questions? Reply to your checklist email or contact <a class="contact-email" href="mailto:hello@calmtax.co">hello@calmtax.co</a>.</span></div><p class="footer-note">© 2026 Calm Tax Co.</p>';}
function completedCount(){const items=state.items||[];return items.filter(function(item,idx){return checked.has(idx);}).length;}
async function toggleChecklistItem(idx,event){if(event)event.stopPropagation();idx=Number(idx);if(Number.isNaN(idx))return;if(checked.has(idx))checked.delete(idx);else checked.add(idx);render();try{await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});}catch(error){console.error(error);}}
function setRowStatus(idx,type,message){const el=document.getElementById('rowStatus-'+idx);if(!el)return;const icon=type==='loading'?'<span class="mini-spinner"></span>':type==='success'?'<span class="upload-check">✓</span>':'';el.innerHTML=icon+esc(message||'');}
function formatFileSize(bytes){if(!bytes)return '0 KB';const kb=bytes/1024;if(kb<1024)return Math.round(kb)+' KB';return (kb/1024).toFixed(1)+' MB';}
function readFileAsDataURL(file){return new Promise(function(resolve,reject){const r=new FileReader();r.onload=function(){resolve(r.result);};r.onerror=function(){reject(new Error('Could not read '+file.name));};r.readAsDataURL(file);});}
async function load(){try{if(!CLIENT_ID)throw new Error('Missing checklist link code.');state=await api({form_type:'getChecklist',clientId:CLIENT_ID});checked=new Set((state.checkedIndexes||[]).map(Number));render();}catch(e){document.getElementById('app').innerHTML='<div class="err"><strong>The checklist could not load.</strong><br>'+esc(e.message)+'<br><br>Please refresh the page. If the problem continues, contact hello@calmtax.co.</div>';}}
function openRowFilePicker(idx,event){if(event)event.stopPropagation();const input=document.getElementById('rowFileInput-'+idx);if(input)input.click();}
function handleRowFileInput(idx,event){const files=Array.from(event.target.files||[]);event.target.value='';if(files.length)uploadFilesForChecklistItem(idx,files);}
function rowDragEnter(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('drag-over');}
function rowDragOver(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('drag-over');}
function rowDragLeave(e,idx){e.preventDefault();e.stopPropagation();const row=e.currentTarget;if(!row||row.contains(e.relatedTarget))return;row.classList.remove('drag-over');}
function rowDrop(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drag-over');const files=Array.from(e.dataTransfer&&e.dataTransfer.files?e.dataTransfer.files:[]);if(files.length)uploadFilesForChecklistItem(idx,files);}
function openOtherFilePicker(e){if(e)e.stopPropagation();const input=document.getElementById('otherFileInput');if(input)input.click();}
function handleOtherFileInput(e){const files=Array.from(e.target.files||[]);e.target.value='';if(files.length)uploadFilesAsOther(files);}
function otherDragEnter(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.add('drag-over');}
function otherDragOver(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.add('drag-over');}
function otherDragLeave(e){e.preventDefault();e.stopPropagation();const row=document.getElementById('otherUploadRow');if(!row||row.contains(e.relatedTarget))return;row.classList.remove('drag-over');}
function otherDrop(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.remove('drag-over');const files=Array.from(e.dataTransfer&&e.dataTransfer.files?e.dataTransfer.files:[]);if(files.length)uploadFilesAsOther(files);}
async function uploadFilesForChecklistItem(idx,files){const button=document.getElementById('uploadBtn-'+idx);if(button)button.disabled=true;try{for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus(idx,'loading',prefix+'Uploading '+originalFile.name+' ('+formatFileSize(originalFile.size)+')…');const dataUrl=await readFileAsDataURL(originalFile);const label=selectedLabelForIndex(idx);const cleanLabel=cleanDocLabel(label);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:label,docTypeLabel:cleanLabel,checklistIndex:idx}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:idx,docTypeLabel:cleanLabel});}checked.add(Number(idx));await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});render();setRowStatus(idx,'success',files.length>1?files.length+' files uploaded.':'Upload complete.');}catch(error){setRowStatus(idx,'error','Upload failed: '+error.message);}finally{const fresh=document.getElementById('uploadBtn-'+idx);if(fresh)fresh.disabled=false;}}
async function uploadFilesAsOther(files){try{for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus('other','loading',prefix+'Uploading '+originalFile.name+'…');const dataUrl=await readFileAsDataURL(originalFile);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:'Other Documents',docTypeLabel:'Other Documents',checklistIndex:''}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:'',docTypeLabel:'Other Documents'});}render();setRowStatus('other','success',files.length>1?files.length+' files uploaded.':'Upload complete.');}catch(error){setRowStatus('other','error','Upload failed: '+error.message);}}
function deleteFile(fileId,event){event.stopPropagation();if(!fileId||state.canDeleteFiles===false)return;const button=event.currentTarget;const row=button?button.closest('.row-file'):null;if(!row)return;document.querySelectorAll('.delete-confirm').forEach(function(p){p.remove();});document.querySelectorAll('.confirming-delete').forEach(function(el){el.classList.remove('confirming-delete');});const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const name=rec?(clientDisplayFileName(rec)||'this file'):'this file';row.classList.add('confirming-delete');const panel=document.createElement('div');panel.className='delete-confirm';panel.innerHTML='<div>Delete “'+esc(name)+'”? This cannot be undone.</div><div class="delete-confirm-actions"><button type="button" class="delete-confirm-cancel">Cancel</button><button type="button" class="delete-confirm-ok">Delete file</button></div>';row.appendChild(panel);panel.querySelector('.delete-confirm-cancel').onclick=function(e){e.stopPropagation();panel.remove();row.classList.remove('confirming-delete');};panel.querySelector('.delete-confirm-ok').onclick=function(e){e.stopPropagation();confirmDeleteFile(fileId,row,button,e.currentTarget);};}
async function confirmDeleteFile(fileId,row,originalButton,confirmButton){const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const deletedIndex=rec&&rec.checklistIndex!==undefined&&rec.checklistIndex!==''?Number(rec.checklistIndex):null;row.classList.add('deleting');if(originalButton)originalButton.disabled=true;if(confirmButton){confirmButton.disabled=true;confirmButton.innerHTML='<span class="mini-spinner"></span>Deleting...';}try{await api({form_type:'deleteFile',clientId:CLIENT_ID,fileId:fileId});state.uploadedFiles=(state.uploadedFiles||[]).filter(function(f){return String(f.id)!==String(fileId);});if(deletedIndex!==null&&!Number.isNaN(deletedIndex)){const still=state.uploadedFiles.some(function(f){return Number(f.checklistIndex)===Number(deletedIndex);});if(!still){checked.delete(deletedIndex);await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});}}render();}catch(error){row.classList.remove('deleting');if(originalButton)originalButton.disabled=false;if(confirmButton){confirmButton.disabled=false;confirmButton.textContent='Delete file';}const p=row.querySelector('.delete-confirm div');if(p)p.textContent='Delete failed: '+error.message;}}
window.addEventListener('error',function(e){const app=document.getElementById('app');if(app&&app.textContent.indexOf('Loading your checklist')!==-1){app.innerHTML='<div class="err"><strong>The checklist could not load.</strong><br>'+esc(e.message||'A page error occurred.')+'<br><br>Please refresh the page. If the problem continues, contact hello@calmtax.co.</div>';}});
load();
</script>
</body>
</html>
