<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm Tax Co. Document Checklist & Upload Page</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf8f5; --bg2:#f4f1ea; --white:#fff; --ink:#3C3633; --mid:#4A545C;
  --sage:#7D8E7E; --clay:#A66D5E; --border:rgba(60,54,51,.12);
  --r:14px; --rl:20px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:980px; margin:0 auto; padding:32px 18px 80px; }
.card { background:var(--white); border:1px solid var(--border); border-radius:var(--rl); box-shadow:0 4px 16px rgba(60,54,51,.035); padding:34px; }
.brand { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:24px; margin-bottom:30px; gap:16px; }
.logo-svg { width:260px; max-width:58vw; height:auto; display:block; }
.year { text-align:right; }
.year-label { font-size:12px; text-transform:uppercase; letter-spacing:.16em; color:var(--mid); opacity:.65; }
.year-num { font-family:Lora,serif; font-size:34px; }
.title { text-align:center; font-family:Lora,serif; font-style:italic; font-size:44px; line-height:1.1; font-weight:400; margin:18px 0 24px; }
.intro { text-align:center; max-width:720px; margin:0 auto 30px; font-family:Lora,serif; font-size:17px; line-height:1.65; }
.steps { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; border-top:1px solid var(--border); padding-top:30px; margin:28px 0; }
.step { text-align:center; }
.num { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--sage); font-family:Lora,serif; font-weight:600; }
.step h3 { font-family:Lora,serif; font-style:italic; font-size:21px; margin:12px 0 8px; }
.step p { font-size:14px; line-height:1.55; color:var(--mid); margin:0; }
.upload-box { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; background:rgba(125,142,126,.07); border:1.5px solid var(--sage); border-radius:var(--r); padding:22px; margin:28px 0 14px; }
.upload-box h3 { font-family:Lora,serif; font-size:22px; margin:0 0 6px; }
.btn { font-family:Inter,sans-serif; font-size:13px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:#fff; background:var(--ink); border:0; border-radius:999px; padding:14px 28px; cursor:pointer; text-decoration:none; display:inline-block; }
.btn:hover { background:var(--sage); }
.btn[disabled] { opacity:.55; cursor:wait; }
.status { font-size:14px; color:var(--mid); margin-top:10px; }
.privacy { border-left:4px solid var(--sage); background:var(--bg2); border-radius:0 var(--r) var(--r) 0; padding:16px 18px 16px 24px; font-size:14px; line-height:1.65; color:var(--mid); margin:22px 0; }
.group-title { font-family:Lora,serif; font-size:23px; margin:30px 0 12px; border-bottom:1px solid var(--border); padding-bottom:8px; }
.item { display:flex; gap:12px; align-items:flex-start; padding:13px 10px; border-bottom:1px solid rgba(60,54,51,.07); border-radius:8px; cursor:pointer; }
.item:hover { background:rgba(125,142,126,.04); }
.item.checked { opacity:.62; }
.check { width:22px; height:22px; border-radius:50%; border:1.5px solid var(--sage); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; color:transparent; }
.checked .check { background:var(--sage); color:#fff; }
.checked .label { text-decoration:line-through; }
.label { font-size:15px; line-height:1.45; font-weight:500; }
.help { position:relative; display:inline-flex; align-items:center; justify-content:center; margin-left:6px; width:18px; height:18px; border-radius:50%; border:1px solid var(--sage); color:var(--sage); font-size:12px; cursor:help; vertical-align:middle; text-decoration:none; }
.tip { display:none; position:absolute; left:22px; top:-10px; z-index:20; width:min(340px,78vw); background:#fff; border:1px solid var(--border); box-shadow:0 8px 20px rgba(60,54,51,.14); border-radius:10px; padding:12px; text-align:left; color:var(--ink); font-size:13px; line-height:1.45; font-weight:400; text-decoration:none; }
.help:hover .tip, .help:focus .tip, .tip:hover { display:block; }
.tip a { color:var(--sage); font-weight:600; text-decoration:underline; }
.reminder { background:#fff8ea; border:1px solid #ead9b6; border-left:4px solid #d6aa4d; border-radius:0 12px 12px 0; padding:16px 18px 16px 24px; margin:24px 0; font-size:14px; line-height:1.6; }
.files { margin:18px 0 26px; }
.file { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; margin-top:8px; font-size:14px; }
.delete-btn { border:1px solid #e4b6b6; background:#fff5f5; color:#8a3434; border-radius:999px; padding:6px 10px; cursor:pointer; font-size:12px; }
.delete-btn:hover { background:#ffecec; }
.err { background:#fff0f0; border:1px solid #f2c1c1; color:#7a2828; padding:14px; border-radius:12px; }
.loading { text-align:center; padding:60px; color:var(--mid); }
.progress-row { margin-top:8px; padding:8px 10px; border:1px dashed var(--border); border-radius:10px; background:#fff; font-size:13px; color:var(--mid); }
@media(max-width:700px) {
  .brand { align-items:flex-start; }
  .title { font-size:34px; }
  .steps { grid-template-columns:1fr; }
  .card { padding:22px; }
  .year-num { font-size:26px; }
}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"><div class="loading">Loading your checklist…</div></div></div>
<input type="file" id="fileInput" multiple hidden>

<script>
const AS_URL = 'https://script.google.com/macros/s/AKfycbxIqzdrwed8JgxdUUMMtTqVUQDmEmChlm7411oMGUUAF4Jn_8HinPHNDmNwZKb6vddiXg/exec';
const params = new URLSearchParams(location.search);
const CLIENT_ID = params.get('c') || params.get('checklist');
let state = null;
let checked = new Set();

function esc(value) {
  return String(value || '').replace(/[&<>"']/g, function (char) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char];
  });
}

async function api(payload) {
  const response = await fetch(AS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });

  const text = await response.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (error) {
    throw new Error('Unexpected server response.');
  }

  if (!data || data.status === 'error') {
    throw new Error(data && data.message ? data.message : 'Request failed.');
  }

  return data;
}

function categoryFor(item) {
  const t = item.toLowerCase();
  if (t.includes('ssn') || t.includes('itin') || t.includes('prior year')) return 'Identity & Prior Return';
  if (t.includes('w-2') || t.includes('1099') || t.includes('income') || t.includes('sales report') || t.includes('ssa-') || t.includes('unemployment')) return 'Income Documents';
  if (t.includes('business') || t.includes('expense') || t.includes('mileage') || t.includes('vehicle') || t.includes('equipment') || t.includes('cost of goods')) return 'Business & Deduction Records';
  if (t.includes('mortgage') || t.includes('property tax') || t.includes('charitable') || t.includes('medical') || t.includes('childcare') || t.includes('home office') || t.includes('student') || t.includes('tuition') || t.includes('ira') || t.includes('adoption') || t.includes('energy') || t.includes('alimony')) return 'Deduction & Credit Records';
  if (t.includes('1095-a') || t.includes('hsa') || t.includes('bank routing') || t.includes('irs notice') || t.includes('state tax notice') || t.includes('estimated tax')) return 'Other Tax Items';
  return 'Additional Documents';
}

function helpFor(item) {
  const t = item.toLowerCase();

  if (t.includes('ssn') || t.includes('itin')) {
    return 'If this number already appears on another uploaded tax form, such as a W-2, you do not need a separate document. If it does not, upload a clear image of a Social Security card, ITIN letter, prior-year return page, or a typed note with the name and number.';
  }
  if (t.includes('w-2')) return 'Usually available from your employer or payroll portal, such as ADP, Gusto, Workday, Paychex, or your employer’s HR site.';
  if (t.includes('1099-b')) return 'Usually available from your brokerage account tax documents section. This reports investment sales.';
  if (t.includes('1099-div')) return 'Usually available from your bank or brokerage tax documents section. This reports dividends.';
  if (t.includes('1099-int')) return 'Usually available from your bank or financial institution tax documents section. This reports interest income.';
  if (t.includes('1099-nec')) return 'Usually sent by clients or platforms that paid you as a contractor. Check email, payment portals, or client tax document areas.';
  if (t.includes('1099-k')) return 'Usually available inside PayPal, Venmo, Stripe, Square, Cash App for Business, Etsy, eBay, or other payment platform tax document sections.';
  if (t.includes('1099-g')) return 'Usually available from your state unemployment or tax agency website. This often reports unemployment or state tax refunds.';
  if (t.includes('ssa-1099') || t.includes('1099-r')) return 'SSA-1099 is usually available from Social Security. 1099-R is usually available from your retirement account, pension provider, IRA custodian, or plan administrator.';
  if (t.includes('rental income summary')) return 'A simple document or spreadsheet with total rent received for the year is usually enough to get started.';
  if (t.includes('business expense totals')) {
    return 'You can upload a spreadsheet or document showing totals by category. Include cost of goods sold if you sell products. <br><br><a href="https://www.irs.gov/instructions/i1040sc" target="_blank" rel="noopener">View IRS Schedule C instructions</a>';
  }
  if (t.includes('mileage')) return 'Upload your mileage summary or log showing business miles, total miles, dates or date range, and how you tracked the mileage.';
  if (t.includes('1095-a')) return 'Download this from Healthcare.gov or your state Marketplace account. This is required if you had Marketplace insurance.';
  if (t.includes('1098 mortgage')) return 'Usually available from your mortgage lender online account or year-end statement.';
  if (t.includes('1098-t')) return 'Usually available from the school’s student account, bursar, or financial portal.';
  if (t.includes('1098-e')) return 'Usually available from your student loan servicer.';
  if (t.includes('estimated tax')) return 'Upload IRS/state confirmation emails, EFTPS confirmations, bank records, or a list of dates and amounts paid.';
  if (t.includes('bank routing')) return 'Upload a voided check or a typed note with routing number, account number, account type, and bank name.';

  return '';
}

function itemHtml(item, idx) {
  const tip = helpFor(item);
  const isChecked = checked.has(idx);
  const help = tip
    ? '<span class="help" tabindex="0" onclick="event.stopPropagation()">?<span class="tip">' + tip + '</span></span>'
    : '';

  return (
    '<div class="item ' + (isChecked ? 'checked' : '') + '" data-idx="' + idx + '" onclick="toggleItem(' + idx + ')">' +
      '<div class="check">✓</div>' +
      '<div><div class="label">' + esc(item) + help + '</div></div>' +
    '</div>'
  );
}

function fileHtml(file) {
  const id = esc(file.id || '');
  const name = esc(file.name || 'Uploaded file');
  const date = file.timestamp ? new Date(file.timestamp).toLocaleDateString() : '';

  return (
    '<div class="file">' +
      '<span>📄 ' + name + '</span>' +
      '<span>' + esc(date) + (id ? ' <button class="delete-btn" onclick="deleteFile(\'' + id + '\', event)">Delete</button>' : '') + '</span>' +
    '</div>'
  );
}

function render() {
  if (!state) return;

  const items = state.items || [];
  const groups = {};

  items.forEach(function (item, idx) {
    const category = categoryFor(item);
    if (!groups[category]) groups[category] = [];
    groups[category].push({ item: item, idx: idx });
  });

  const order = [
    'Identity & Prior Return',
    'Income Documents',
    'Business & Deduction Records',
    'Deduction & Credit Records',
    'Other Tax Items',
    'Additional Documents'
  ];

  let checklistHtml = '';
  order.forEach(function (category) {
    let group = groups[category];
    if (!group || !group.length) return;
    group = group.slice().sort(function (a, b) {
      return Number(checked.has(a.idx)) - Number(checked.has(b.idx));
    });
    checklistHtml += '<div class="group-title">' + category + '</div>' + group.map(function (row) {
      return itemHtml(row.item, row.idx);
    }).join('');
  });

  const files = (state.uploadedFiles || []).map(fileHtml).join('');
  const firstName = ((state.name || '').split(' ')[0] || 'there');

  document.getElementById('app').innerHTML =
    '<div class="brand">' +
      '<div>' +
        '<svg viewBox="15 22 390 108" fill="none" class="logo-svg" xmlns="http://www.w3.org/2000/svg">' +
          '<text x="46" y="92" font-family="Cormorant Garamond, Georgia, serif" font-size="96" font-weight="300" font-style="italic" fill="#2A2A2A">Calm</text>' +
          '<line x1="272" y1="38" x2="272" y2="100" stroke="#C4BDB3" stroke-width="1.6"></line>' +
          '<text x="288" y="65" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">TAX</text>' +
          '<text x="288" y="92" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">CO.</text>' +
          '<path d="m 18.361809,116.41876 q 94.000001,-12 196.000001,0 102,12 174,0" stroke="#9a9590" stroke-width="2.2" fill="none" stroke-linecap="round"></path>' +
        '</svg>' +
      '</div>' +
      '<div class="year"><div class="year-label">Tax Year</div><div class="year-num">2025</div></div>' +
    '</div>' +
    '<div class="title">Upload Documents<br>& Checklist</div>' +
    '<p class="intro">Thank you for completing your walkthrough, ' + esc(firstName) + '. This checklist will help you gather the documents and information needed for your return. Upload what you already have, and you can come back later as you find more.</p>' +
    '<div class="steps">' +
      '<div class="step"><div class="num">01</div><h3>Review</h3><p>Use your checklist to gather the documents and information needed for your return.</p></div>' +
      '<div class="step"><div class="num">02</div><h3>Upload Securely</h3><p>Add files directly from this secure page as you locate them.</p></div>' +
      '<div class="step"><div class="num">03</div><h3>Receive Quote</h3><p>Once we review your documents, we’ll send your quote before preparation begins.</p></div>' +
    '</div>' +
    '<div class="upload-box">' +
      '<div><h3>📂 Secure Upload</h3><div class="status" id="uploadStatus">Choose files to add them to your Calm Tax Co. folder.</div><div id="uploadProgress"></div></div>' +
      '<button class="btn" id="uploadBtn" onclick="document.getElementById(\'fileInput\').click()">Upload Documents</button>' +
    '</div>' +
    '<div class="files"><div class="group-title">Uploaded Files</div><div id="filesList">' + (files || '<div class="status">No files uploaded yet.</div>') + '</div></div>' +
    '<div class="privacy"><strong>Privacy & security:</strong> Your privacy matters to us. We use secure cloud storage and encryption to help protect your tax documents. Access is limited to the people involved in preparing your return, and we never sell your information.</div>' +
    (state.hasItemizedDeductions ? '<div class="reminder">💡 <strong>Itemized deduction reminder:</strong> Because you selected possible itemized deductions, you do not need to track down every small receipt before getting started. The most helpful records are usually larger or official documents, such as mortgage interest statements, property tax records, larger charitable donation records, and significant medical expense records. Upload what you already have, and we will let you know if anything else is likely to help.</div>' : '') +
    '<div id="items">' + checklistHtml + '</div>';
}

async function load() {
  try {
    if (!CLIENT_ID) throw new Error('Missing checklist link code.');
    state = await api({ form_type: 'getChecklist', clientId: CLIENT_ID });
    checked = new Set((state.checkedIndexes || []).map(Number));
    render();
  } catch (error) {
    document.getElementById('app').innerHTML = '<div class="err">' + esc(error.message) + '</div>';
  }
}

async function toggleItem(idx) {
  if (checked.has(idx)) checked.delete(idx);
  else checked.add(idx);
  render();

  try {
    await api({ form_type: 'saveChecklistState', clientId: CLIENT_ID, checkedIndexes: Array.from(checked) });
  } catch (error) {
    alert('Could not save checklist change: ' + error.message);
  }
}

function readFileAsDataURL(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(new Error('Could not read file.')); };
    reader.readAsDataURL(file);
  });
}

async function uploadSelectedFiles(files) {
  const button = document.getElementById('uploadBtn');
  const status = document.getElementById('uploadStatus');
  const progress = document.getElementById('uploadProgress');

  button.disabled = true;
  progress.innerHTML = '';

  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      status.textContent = 'Uploading ' + file.name + '…';
      progress.innerHTML = '<div class="progress-row">Uploading ' + esc(file.name) + '…</div>';

      const dataUrl = await readFileAsDataURL(file);
      const result = await api({
        form_type: 'uploadFile',
        clientId: CLIENT_ID,
        file: { name: file.name, mimeType: file.type, dataUrl: dataUrl }
      });

      if (!state.uploadedFiles) state.uploadedFiles = [];
      state.uploadedFiles.push({
        name: result.fileName || file.name,
        id: result.fileId || '',
        timestamp: new Date().toISOString()
      });

      progress.innerHTML = '<div class="progress-row">✓ Uploaded ' + esc(file.name) + '</div>';
    }

    status.textContent = 'Upload complete.';
    render();
  } catch (error) {
    alert('Upload failed: ' + error.message);
    status.textContent = 'Upload failed. Please try again.';
  } finally {
    button.disabled = false;
    document.getElementById('fileInput').value = '';
  }
}

async function deleteFile(fileId, event) {
  event.stopPropagation();

  if (!fileId) return;
  if (!confirm('Delete this uploaded file?')) return;

  try {
    await api({ form_type: 'deleteFile', clientId: CLIENT_ID, fileId: fileId });
    state.uploadedFiles = (state.uploadedFiles || []).filter(function (file) {
      return file.id !== fileId;
    });
    render();
  } catch (error) {
    alert('Could not delete file: ' + error.message);
  }
}

document.getElementById('fileInput').addEventListener('change', function (event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  uploadSelectedFiles(files);
});

load();
</script>
</body>
</html>
