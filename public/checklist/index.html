y:Lora,serif;font-size:28px;font-weight:500;font-style:italic;margin:0}.modal p{color:var(--mid);line-height:1.65}.modal-close{border:1px solid var(--border);background:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:20px;color:var(--mid)}.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:16px 0}.device-btn{border:1px solid rgba(125,142,126,.30);background:rgba(125,142,126,.06);border-radius:14px;padding:13px 10px;cursor:pointer;color:var(--ink);font-weight:700;font-family:Inter,sans-serif}.device-btn:hover,.device-btn.active{background:var(--sage);color:#fff}.device-panel{display:none;border:1px solid rgba(125,142,126,.22);border-radius:16px;background:#faf8f5;padding:16px 18px;margin-top:12px}.device-panel.active{display:block}.device-panel h3{font-family:Lora,serif;font-size:21px;margin:0 0 8px}.device-panel ol{margin:8px 0 0 22px;padding:0;color:var(--mid);line-height:1.65;font-size:14px}.thank-you-panel{border:1px solid rgba(46,125,50,.22);background:rgba(46,125,50,.06);border-radius:16px;padding:18px;margin:18px 0;text-align:left}.thank-you-panel strong{color:var(--success)}@media(max-width:700px){.brand{align-items:flex-start}.brand-left{gap:6px}.secure-header-note{font-size:12px;margin-left:2px}.logo-svg{width:210px}.year-num{font-size:28px}.title{font-size:34px}.journey{padding-left:6px;padding-right:6px}.journey-track{gap:4px}.journey-track:before{top:16px;left:12%;right:12%}.journey-dot{width:34px;height:34px;font-size:13px}.journey-label{font-size:14px}.card{padding:20px}.item.row-upload{flex-direction:column}.item-head{width:100%}.item-actions{margin-left:34px;padding-left:0;justify-content:flex-start}.row-files,.row-status{margin-left:34px}.contact-card{align-items:flex-start;text-align:left}}

.entry-card{margin:12px 0 0 34px;border:1px solid rgba(125,142,126,.22);background:rgba(125,142,126,.045);border-radius:16px;padding:16px 16px 14px}
.entry-title{font-family:Lora,serif;font-size:19px;font-weight:500;color:var(--ink);margin:0 0 5px}
.entry-help{font-size:13px;line-height:1.55;color:var(--mid);margin:0 0 14px}
.entry-help em,.soft-em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:#4A545C;font-size:1.15em}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.entry-field{display:flex;flex-direction:column;gap:6px}
.entry-field.full{grid-column:1/-1}
.entry-field label{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mid)}
.entry-field.compact-label label{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.entry-field input,.entry-field select,.entry-field textarea{width:100%;border:1px solid rgba(60,54,51,.14);border-radius:12px;background:#fff;color:var(--ink);font-family:Inter,sans-serif;font-size:15px;padding:12px 13px;outline:none}.entry-field input::placeholder,.entry-field textarea::placeholder{color:rgba(74,84,92,.48);font-style:italic}
.entry-field textarea{min-height:82px;resize:vertical;line-height:1.5}
.entry-field input:focus,.entry-field select:focus,.entry-field textarea:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(125,142,126,.10)}
.sensitive-wrap{position:relative}
.sensitive-wrap input{padding-right:44px}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:999px;background:rgba(125,142,126,.10);color:var(--sage);cursor:pointer;font-size:15px}
.entry-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.entry-save{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 15px;font-family:Inter,sans-serif;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.entry-save:hover{background:var(--sage)}
.entry-validation{font-size:13px;line-height:1.4;color:var(--mid);min-height:18px}
.entry-validation.ok{color:var(--sage);font-weight:600}
.entry-validation.attn{color:var(--clay);font-weight:600}
.entry-divider{height:1px;background:rgba(60,54,51,.09);margin:15px 0 12px}
.upload-alternative{font-size:13px;color:var(--mid);line-height:1.55;margin:0}
.upload-alternative em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:#4A545C;font-size:1.16em}.entry-support-note{font-size:13px;line-height:1.55;color:var(--mid);margin:10px 0 0}.entry-support-note a{color:var(--sage);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.help-panel-link{border:0;background:transparent;color:var(--sage);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:Inter,sans-serif;font-size:13px;padding:0;margin:0}
.inline-help-panel{display:none;margin:10px 0 0;padding:13px 14px;border:1px solid rgba(125,142,126,.24);border-radius:12px;background:#fff;color:var(--mid);font-size:13px;line-height:1.6}
.inline-help-panel.open{display:block}
.inline-help-panel ul{margin:8px 0 8px 18px;padding:0}
.inline-help-panel li{margin:4px 0}
.help{cursor:pointer}
.help.open .tip{display:block}
@media(max-width:700px){.entry-card{margin-left:0}.entry-grid{grid-template-columns:1fr}.entry-actions{align-items:stretch}.entry-save,.row-upload-btn{min-height:42px}.help{width:30px;height:30px;margin-left:8px}.tip{left:auto;right:0;top:34px;width:min(340px,84vw)}}


/* Calm Tax v1.2 checklist polish */
.item.row-upload{padding:18px 16px;margin-bottom:14px;border-radius:16px;gap:14px;}
.item-head{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;width:100%;}
.item-title-wrap{min-width:0;width:100%;}
.label{display:block;width:100%;font-size:15.5px;line-height:1.5;}
.item-actions{grid-column:2;margin:12px 0 0 0;padding-left:0;justify-content:flex-start;flex-wrap:wrap;gap:8px;}
.action-pill{border:1px solid rgba(125,142,126,.34);background:rgba(255,255,255,.82);color:var(--ink);border-radius:999px;min-height:38px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(60,54,51,.025);transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease;}

.action-pill.terracotta{border-color:rgba(166,109,94,.28);background:rgba(166,109,94,.055);}
.action-pill.terracotta:hover{background:rgba(166,109,94,.10);border-color:rgba(166,109,94,.44);}
.row-upload-btn{font-size:13px;letter-spacing:0;text-transform:none;min-height:38px;}
.entry-card{display:none;margin:14px 0 0 0;}

1099-g'))return 'Usually available from your state unemployment agency or state tax department website. It may report unemployment income or a state tax refund.';if(t.includes('1099-r'))return 'Usually issued by pension providers, retirement accounts, IRA custodians, and annuity companies.';if(t.includes('ssa-1099'))return 'Usually mailed by Social Security or available in your Social Security online account.';if(t.includes('rental income summary'))return 'A simple spreadsheet showing total rent received during the year is usually sufficient. If you use bookkeeping software or a property management system, you may upload an annual income report instead.';if(t.includes('rental expense'))return 'For a property you rented to others or held available for rent, provide rental property expense totals by category. Common categories include mortgage interest, property taxes, insurance, repairs, maintenance, utilities, HOA dues, management fees, supplies, advertising, and other rental expenses. This is separate from your personal home office or business-use-of-home expenses. If the property was also used personally, include a note so we can review any rental/personal allocation.';if(t.includes('rental property purchased')||((t.includes('closing disclosure')||t.includes('settlement statement'))&&t.includes('rental property')))return 'If you purchased a rental property during the year, upload your Closing Disclosure (or HUD-1 if applicable). This helps establish your tax basis and depreciation.';if(t.includes('scholarship')||t.includes('grant information'))return 'Usually available from your college financial aid office, student portal, or Form 1098-T details.';if(t.includes('1098 mortgage')||t.includes('mortgage interest'))return 'Usually available from the mortgage lender for your primary home. '+itemizedTip();if(t.includes('property tax'))return 'If your property taxes are paid through your mortgage escrow account, start by checking your Form 1098 mortgage interest statemen function collectEntryValues(idx){
  const first=document.querySelector('.entry-card [id^="entry-'+idx+'-"]');

  const values={};
  if(!card)return values;

    const key=input.getAttribute('data-entry-field');
    if(key)values[key]=input.value||'';

}

function formatTipContent(text){let raw=String(text||'').trim();if(!raw)return '';let parts=raw.split(/\s*<br><br>\s*/).filter(Boolean);if(parts.length===1&&raw.indexOf('<')===-1&&raw.length>150){const sentences=raw.split(/(?<=\.)\s+/);parts=[];for(let i=0;i<sentences.length;i+=2){parts.push(sentences.slice(i,i+2).join(' '));}}return parts.map(function(part){return '<p>'+part+'</p>';}).join('');}

function entryCardHtml(item,idx){const meta=metaForIndex(idx);if(!meta||meta.mode==='upload'||!meta.fields||!meta.fields.length)return '';const values=valuesForIndex(idx);const labelLower=cleanItemLabel(item).toLowerCase();const isBank=(labelLower.includes('bank')||labelLower.includes('routing'));let fields='';if(meta.repeatableDependentTaxIds){fields=dependentTaxRowsHtml(meta,idx,values);}else{(meta.fields||[]).forEach(function(field){fields+=fieldInputHtml(field,idx,values[field.key]||'');if(isBank&&field.key==='accountNumber'){const confirmId='entry-'+idx+'-confirmAccountNumber';fields+='<div class="entry-field"><label for="'+confirmId+'">Confirm account number</label><div class="sensitive-wrap"><input id="'+confirmId+'" type="text" class="sensitive-masked" value="'+esc(values.accountNumber||'')+'" data-confirm-account="true" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" oninput="validateEntry('+idx+')"><button class="eye-btn" type="button" aria-label="Show or hide confirm account number" onclick="toggleSensitiveField(\''+confirmId+'\',event)">'+svgIcon('eye')+'</button></div></div>';}});}const title=esc(meta.entryTitle||'Enter Information');return '<div class="entry-card entry-card-collapsed" id="entryPanel-'+idx+'" onclick="event.stopPropagation()"><div class="entry-choice-row"><span class="action-or entry-action-or">or</span><button class="entry-toggle-pill" type="button" onclick="toggleEntryPanel('+idx+',event)">'+svgIcon('keyboard')+'Enter Information <span class="entry-toggle-icon">▾</span></button></div><div class="entry-inner"><div class="entry-title">'+title+'</div>'+(isBank?bankingHelpHtml(idx):'')+'<div class="entry-grid">'+fields+'</div>'+(meta.helpAfter?'<p class="entry-support-note">'+meta.helpAfter+'</p>':'')+'<div class="entry-actions"><button class="entry-save" type="button" onclick="saveChecklistEntry('+idx+',event)">Save information</button><span class="entry-validation" id="entryValidation-'+idx+'"></span></div><div class="entry-divider"></div><p class="upload-alternative">Prefer not to type this? <em>Upload a document containing this information instead.</em></p></div></div>';}
function itemHtml(item,idx){const tip=helpFor(item);const files=uploadedFilesForIndex(idx);const isComplete=checked.has(idx);const meta=metaForIndex(idx);const hasEntry=meta&&meta.mode&&meta.mode!=='upload'&&meta.fields&&meta.fields.length;const help=tip?'<span class="help" tabindex="0" onclick="toggleHelpBubble(event,this)">?<span class="tip" onclick="event.stopPropagation();">'+formatTipContent(tip)+'</span></span>':'';const uploadText='Upload Document';return '<div class="item row-upload '+(isComplete?'checked':'')+'" data-idx="'+idx+'" ondragenter="rowDragEnter(event,'+idx+')" ondragover="rowDragOver(event,'+idx+')" ondragleave="rowDragLeave(event,'+idx+')" ondrop="rowDrop(event,'+idx+')"><div class="item-main"><div class="item-head"><div class="check" role="button" tabindex="0" title="Check off this item" onclick="toggleChecklistItem('+idx+',event)">✓</div><div class="item-title-wrap"><div class="label">'+esc(cleanItemLabel(item))+help+'</div></div><div class="item-actions"><button class="action-pill single-upload-pill" type="button" id="uploadBtn-'+idx+'" onclick="openRowFilePicker('+idx+',event,\'files\')">'+svgIcon('file')+uploadText+'</button></div></div>'+entryCardHtml(item,idx)+'<div class="row-status" id="rowStatus-'+idx+'"></div>'+(files.length?'<div class="row-files">'+files.map(fileHtml).join('')+'</div>':'')+'<input class="hidden-row-file-input" type="file" id="rowFileInput-'+idx+'" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.txt,.rtf,.csv,.xls,.xlsx,.ods,.numbers,image/*,application/pdf" onchange="handleRowFileInput('+idx+',event)"></div></div>';}

function normalOtherUploadHtml(otherFiles){return '<div class="other-upload-row" id="otherUploadRow" ondragenter="otherDragEnter(event)" ondragover="otherDragOver(event)" ondragleave="otherDragLeave(event)" ondrop="otherDrop(event)"><h3>Other Documents</h3><p>Use this for anything that does not clearly match a checklist row.</p><button class="btn" type="button" onclick="openOtherFilePicker(event)">Upload Other Documents</button><input class="hidden-row-file-input" type="file" id="otherFileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.txt,.rtf,.csv,.xls,.xlsx,.ods,.numbers" onchange="handleOtherFileInput(event)"><div class="row-status" id="rowStatus-other"></div>'+(otherFiles?'<div class="row-files" style="margin-left:0;margin-top:12px">'+otherFiles+'</div>':'')+'</div>';}
function cleanDocLabel(label){return String(label||'').replace(/[\/:*?"<>|#%{}~&]/g,'-').replace(/\s+/g,' ').trim().slice(0,80);}
function selectedLabelForIndex(idx){return state&&state.items&&state.items[idx]?cleanItemLabel(state.items[idx]):'';}
function canonicalChecklistKey(item){const t=cleanItemLabel(item).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();if(t.includes('banking information')||t.includes('bank account information')||t.includes('routing number'))return 'banking-information';if(t.includes('childcare provider')&&(t.includes('ein')||t.includes('ssn'))&&t.includes('total amount paid'))return 'childcare-provider-info';if(t.includes('vehicle details')&&t.includes('make')&&t.includes('model')&&t.includes('business miles')&&t.includes('total miles'))return 'vehicle-details-mileage';if(t.includes('business expense totals')||t.includes('total annual expense amount'))return 'business-expense-totals';return t;}
function isBankingChecklistItem(item){return canonicalChecklistKey(item)==='banking-information';}
function visibleChecklistItems(){const source=state&&state.items?state.items:[];const seen={};return source.map(function(item,idx){return {item:item,idx:idx};}).filter(function(row){const key=canonicalChecklistKey(row.item);if(seen[key])return false;seen[key]=true;return true;});}
function groupProgressInfo(group){const total=group.length;const done=group.filter(function(row){return checked.has(row.idx);}).length;const remaining=total-done;if(done>=total&&total>0)return {cls:'complete',symbol:'●',text:'Complete'};if(done>0)return {cls:'in-progress',symbol:'◐',text:remaining+' item'+(remaining===1?'':'s')+' still needed'};return {cls:'not-started',symbol:'○',text:total+' item'+(total===1?'':'s')+' still needed'};}
function groupBlockHtml(cat,group,body,open){const info=groupProgressInfo(group);return '<div class="group-block '+info.cls+(open?'':' collapsed')+'"><button class="group-summary" type="button" onclick="toggleChecklistGroup(this,event)"><span class="group-name">'+esc(cat)+'</span><span class="group-progress"><span class="group-symbol">'+info.symbol+'</span>'+esc(info.text)+' <span class="group-chevron">▾</span></span></button><div class="group-items">'+body+'</div></div>';}
function toggleChecklistGroup(btn,event){if(event)event.stopPropagation();const block=btn&&btn.closest?btn.closest('.group-block'):null;if(!block)return;block.classList.toggle('collapsed');}
function render(){if(!state)return;const visibleItems=visibleChecklistItems();const items=visibleItems.map(function(row){return row.item;});const groups={};visibleItems.forEach(function(row){const c=categoryFor(row.item);if(!groups[c])groups[c]=[];groups[c].push({item:row.item,idx:row.idx});});const order=['Identity & Prior Return','Income Documents','Business & Deduction Records','Personal Deductions & Credits','Other Tax Items','Additional Documents'];let checklistHtml='';let groupNumber=0;order.forEach(function(cat){let group=groups[cat];if(!group||!group.length)return;group=group.slice().sort(function(a,b){return Number(checked.has(a.idx))-Number(checked.has(b.idx));});const body=group.map(function(row){return itemHtml(row.item,row.idx);}).join('');const info=groupProgressInfo(group);const open=(groupNumber===0||info.cls==='in-progress');checklistHtml+=groupBlockHtml(cat,group,body,open);groupNumber++;});const firstName=((state.name||'').split(' ')[0]||'there');const otherFiles=(state.uploadedFiles||[]).filter(function(f){return f.checklistIndex===''||f.checklistIndex===null||f.checklistIndex===undefined;}).map(fileHtml).join('');const ready=isReturnReadyMode();const complete=isCompleteMode();document.title=complete?'Your Tax Return Is Complete | Calm Tax Co.':(ready?'Review Your Tax Return | Calm Tax Co.':'Calm Tax Co. Tax Checklist & Documents');let html='<div class="brand"><div class="brand-left"><div>'+logo()+'</div><div class="secure-header-note"><svg class="secure-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.4 2.8 8.4 7 10 4.2-1.6 7-5.6 7-10V6z"/><path d="m9.5 12 1.7 1.7 3.8-4"/></svg><span>Secure upload page</span></div></div><div class="year"><div class="year-label">Tax Year</div><div class="year-num">2025</div></div></div>'+(complete?'':journeyHtml());if(complete){html+='<h1 class="title">Your Tax Return<br>Is Complete</h1>'+returnReviewHtml();}else if(ready){html+='<h1 class="title">Review<br>Your Tax Return</h1>'+returnReviewHtml()+signed8879UploadHtml()+originalChecklistDetailsHtml(checklistHtml,items);}else{html+='<h1 class="title checklist-title"><span class="client-name">Hi '+esc(firstName)+',</span><span class="checklist-subtitle">Your personalized upload checklist is below.</span></h1>'+checklistIntroHtml(firstName)+(state.uploadsLockedMessage?'<div class="privacy lock-note"><strong>Uploads locked:</strong> '+esc(state.uploadsLockedMessage)+'</div>':'')+'<div class="card"><div class="checklist-card-header"><div class="progress-pill">'+progressText(completedCount(),items.length)+'</div><p class="checklist-card-instructions">For each item, upload a document or enter the information directly when available. You can manually check or uncheck items anytime.</p></div><div id="checklistList">'+(checklistHtml||'<p>No checklist items found. Please contact us if you think this is an error.</p>')+'</div>'+normalOtherUploadHtml(otherFiles)+'</div>';}html+=privacyHtml()+'<div class="contact-card"><span class="contact-icon"><svg class="icon-inline" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="m4 7 8 6 8-6"/></svg></span><span>Questions? Reply to your checklist email or contact us at <a class="contact-email" href="mailto:hello@calmtax.co">hello@calmtax.co</a>.</span></div><p class="footer-note">© 2026 Calm Tax Co.</p>';document.getElementById('app').innerHTML=html;}function completedCount(){return visibleChecklistItems().filter(function(row){return checked.has(row.idx);}).length;}
async function toggleChecklistItem(idx,event){
  if(event)event.stopPropagation();
  idx=Number(idx);
  if(Number.isNaN(idx))return;
  const wasComplete=checked.has(idx);
  if(wasComplete){
    checked.delete(idx);
    render();
  }else{
    checked.add(idx);
    showCompletionBeforeRender(idx,'Item complete. Visit the bottom of the checklist to edit.');
  }
  try{
    await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});
  }catch(error){
    console.error(error);
  }
}
function setRowStatus(idx,type,message){const el=document.getElementById('rowStatus-'+idx);if(!el)return;const icon=type==='loading'?'<span class="mini-spinner"></span>':type==='success'?'<span class="upload-check">✓</span>':'';el.innerHTML=icon+esc(message||'');}
function formatFileSize(bytes){if(!bytes)return '0 KB';const kb=bytes/1024;if(kb<1024)return Math.round(kb)+' KB';return (kb/1024).toFixed(1)+' MB';}
function readFileAsDataURL(file){return new Promise(function(resolve,reject){const r=new FileReader();r.onload=function(){resolve(r.result);};r.onerror=function(){reject(new Error('Could not read '+file.name));};r.readAsDataURL(file);});}

async function uploadFilesForChecklistItem(idx,files){const button=document.getElementById('uploadBtn-'+idx);if(button)button.disabled=true;try{for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus(idx,'loading',prefix+'Uploading '+originalFile.name+' ('+formatFileSize(originalFile.size)+')…');const dataUrl=await readFileAsDataURL(originalFile);const label=selectedLabelForIndex(idx);const cleanLabel=cleanDocLabel(label);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:label,docTypeLabel:cleanLabel,checklistIndex:idx}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:idx,docTypeLabel:cleanLabel});}checked.add(Number(idx));await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});showCompletionBeforeRender(idx,'Item complete. Visit the bottom of the checklist to edit.');}catch(error){setRowStatus(idx,'error','Upload failed: '+error.message);}finally{const fresh=document.getElementById('uploadBtn-'+idx);if(fresh)fresh.disabled=false;}}
async function uploadFilesAsOther(files){try{const returnReady=isReturnReadyMode();const docLabel=returnReady?'Signed Form 8879':'Other Documents';for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus('other','loading',prefix+'Uploading '+originalFile.name+'…');const dataUrl=await readFileAsDataURL(originalFile);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:docLabel,docTypeLabel:docLabel,checklistIndex:''}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:'',docTypeLabel:docLabel});}render();setRowStatus('other','success',returnReady?'Form 8879 uploaded successfully.':(files.length>1?files.length+' files uploaded.':'Upload complete.'));}catch(error){setRowStatus('other','error','Upload failed: '+error.message);}}
function deleteFile(fileId,event){event.stopPropagation();if(!fileId||state.canDeleteFiles===false)return;const button=event.currentTarget;const row=button?button.closest('.row-file'):null;if(!row)return;document.querySelectorAll('.delete-confirm').forEach(function(p){p.remove();});document.querySelectorAll('.confirming-delete').forEach(function(el){el.classList.remove('confirming-delete');});const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const name=rec?(clientDisplayFileName(rec)||'this file'):'this file';row.classList.add('confirming-delete');const panel=document.createElement('div');panel.className='delete-confirm';panel.innerHTML='<div>Delete “'+esc(name)+'”? This cannot be undone.</div><div class="delete-confirm-actions"><button type="button" class="delete-confirm-cancel">Cancel</button><button type="button" class="delete-confirm-ok">Delete file</button></div>';row.appendChild(panel);panel.querySelector('.delete-confirm-cancel').onclick=function(e){e.stopPropagation();panel.remove();row.classList.remove('confirming-delete');};panel.querySelector('.delete-confirm-ok').onclick=function(e){e.stopPropagation();confirmDeleteFile(fileId,row,button,e.currentTarget);};}
async function confirmDeleteFile(fileId,row,originalButton,confirmButton){const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const deletedIndex=rec&&rec.checklistIndex!==undefined&&rec.checklistIndex!==''?Number(rec.checklistIndex):null;row.classList.add('deleting');if(originalButton)originalButton.disabled=true;if(confirmButton){confirmButton.disabled=true;confirmButton.innerHTML='<span class="mini-spinner"></span>Deleting...';}try{await api({form_type:'deleteFile',clientId:CLIENT_ID,fileId:fileId});state.uploadedFiles=(state.uploadedFiles||[]).filter(function(f){return String(f.id)!==String(fileId);});if(deletedIndex!==null&&!Number.isNaN(deletedIndex)){const still=state.uploadedFiles.some(function(f){return Number(f.checklistIndex)===Number(deletedIndex);});if(!still){checked.delete(deletedIndex);await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});}}render();}catch(error){row.classList.remove('deleting');if(originalButton)originalButton.disabled=false;if(confirmButton){confirmButton.disabled=false;confirmButton.textContent='Delete file';}const p=row.querySelector('.delete-confirm div');if(p)p.textContent='Delete failed: '+error.message;}}
