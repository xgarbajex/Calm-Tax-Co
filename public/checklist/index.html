y:Lora,serif;font-size:28px;font-weight:500;font-style:italic;margin:0}.modal p{color:var(--mid);line-height:1.65}.modal-close{border:1px solid var(--border);background:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:20px;color:var(--mid)}.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:16px 0}.device-btn{border:1px solid rgba(125,142,126,.30);background:rgba(125,142,126,.06);border-radius:14px;padding:13px 10px;cursor:pointer;color:var(--ink);font-weight:700;font-family:Inter,sans-serif}.device-btn:hover,.device-btn.active{background:var(--sage);color:#fff}.device-panel{display:none;border:1px solid rgba(125,142,126,.22);border-radius:16px;background:#faf8f5;padding:16px 18px;margin-top:12px}.device-panel.active{display:block}.device-panel h3{font-family:Lora,serif;font-size:21px;margin:0 0 8px}.device-panel ol{margin:8px 0 0 22px;padding:0;color:var(--mid);line-height:1.65;font-size:14px}.thank-you-panel{border:1px solid rgba(46,125,50,.22);background:rgba(46,125,50,.06);border-radius:16px;padding:18px;margin:18px 0;text-align:left}.thank-you-panel strong{color:var(--success)}@media(max-width:700px){.brand{align-items:flex-start}.brand-left{gap:6px}.secure-header-note{font-size:12px;margin-left:2px}.logo-svg{width:210px}.year-num{font-size:28px}.title{font-size:34px}.journey{padding-left:6px;padding-right:6px}.journey-track{gap:4px}.journey-track:before{top:16px;left:12%;right:12%}.journey-dot{width:34px;height:34px;font-size:13px}.journey-label{font-size:14px}.card{padding:20px}.item.row-upload{flex-direction:column}.item-head{width:100%}.item-actions{margin-left:34px;padding-left:0;justify-content:flex-start}.row-files,.row-status{margin-left:34px}.contact-card{align-items:flex-start;text-align:left}}

.entry-card{margin:12px 0 0 34px;border:1px solid rgba(125,142,126,.22);background:rgba(125,142,126,.045);border-radius:16px;padding:16px 16px 14px}
.entry-title{font-family:Lora,serif;font-size:19px;font-weight:500;color:var(--ink);margin:0 0 5px}
.entry-help{font-size:13px;line-height:1.55;color:var(--mid);margin:0 0 14px}
.entry-help em,.soft-em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:#4A545C;font-size:1.15em}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.entry-field{display:flex;flex-direction:column;gap:6px}
.entry-field.full{grid-column:1/-1}
.entry-field label{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mid)}
.entry-field.compact-label label{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.entry-field input,.entry-field select,.entry-field textarea{width:100%;border:1px solid rgba(60,54,51,.14);border-radius:12px;background:#fff;color:var(--ink);font-family:Inter,sans-serif;font-size:15px;padding:12px 13px;outline:none}.entry-field input::placeholder,.entry-field textarea::placeholder{color:rgba(74,84,92,.48);font-style:italic}
.entry-field textarea{min-height:82px;resize:vertical;line-height:1.5}
.entry-field input:focus,.entry-field select:focus,.entry-field textarea:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(125,142,126,.10)}
.sensitive-wrap{position:relative}
.sensitive-wrap input{padding-right:44px}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:999px;background:rgba(125,142,126,.10);color:var(--sage);cursor:pointer;font-size:15px}
.entry-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.entry-save{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 15px;font-family:Inter,sans-serif;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.entry-save:hover{background:var(--sage)}
.entry-validation{font-size:13px;line-height:1.4;color:var(--mid);min-height:18px}
.entry-validation.ok{color:var(--sage);font-weight:600}
.entry-validation.attn{color:var(--clay);font-weight:600}
.entry-divider{height:1px;background:rgba(60,54,51,.09);margin:15px 0 12px}
.upload-alternative{font-size:13px;color:var(--mid);line-height:1.55;margin:0}
.upload-alternative em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:#4A545C;font-size:1.16em}.entry-support-note{font-size:13px;line-height:1.55;color:var(--mid);margin:10px 0 0}.entry-support-note a{color:var(--sage);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.help-panel-link{border:0;background:transparent;color:var(--sage);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:Inter,sans-serif;font-size:13px;padding:0;margin:0}
.inline-help-panel{display:none;margin:10px 0 0;padding:13px 14px;border:1px solid rgba(125,142,126,.24);border-radius:12px;background:#fff;color:var(--mid);font-size:13px;line-height:1.6}
.inline-help-panel.open{display:block}
.inline-help-panel ul{margin:8px 0 8px 18px;padding:0}
.inline-help-panel li{margin:4px 0}
.help{cursor:pointer}
.help.open .tip{display:block}
@media(max-width:700px){.entry-card{margin-left:0}.entry-grid{grid-template-columns:1fr}.entry-actions{align-items:stretch}.entry-save,.row-upload-btn{min-height:42px}.help{width:30px;height:30px;margin-left:8px}.tip{left:auto;right:0;top:34px;width:min(340px,84vw)}}


/* Calm Tax v1.2 checklist polish */
.item.row-upload{padding:18px 16px;margin-bottom:14px;border-radius:16px;gap:14px;}
.item-head{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;width:100%;}
.item-title-wrap{min-width:0;width:100%;}
.label{display:block;width:100%;font-size:15.5px;line-height:1.5;}
.item-actions{grid-column:2;margin:12px 0 0 0;padding-left:0;justify-content:flex-start;flex-wrap:wrap;gap:8px;}
.action-pill{border:1px solid rgba(125,142,126,.34);background:rgba(255,255,255,.82);color:var(--ink);border-radius:999px;min-height:38px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(60,54,51,.025);transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease;}

.action-pill.terracotta{border-color:rgba(166,109,94,.28);background:rgba(166,109,94,.055);}
.action-pill.terracotta:hover{background:rgba(166,109,94,.10);border-color:rgba(166,109,94,.44);}
.row-upload-btn{font-size:13px;letter-spacing:0;text-transform:none;min-height:38px;}
.entry-card{display:none;margin:14px 0 0 0;}

  border:1px solid rgba(125,142,126,.24);
  border-radius:22px;
  background:#fff;
  box-shadow:0 20px 60px rgba(60,54,51,.22);
  padding:28px 24px 24px;
  text-align:center;
}
.completion-modal-icon{
  width:46px;
  height:46px;
  margin:0 auto 13px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(125,142,126,.14);
  color:var(--sage);
  font-size:23px;
  font-weight:700;
}
.completion-modal.warning .completion-modal-icon{
  background:rgba(166,109,94,.11);
  color:var(--clay);
  font-size:20px;
}
.completion-modal h2{
  margin:0 0 10px;
  font-family:Lora,serif;
  font-size:27px;
  font-style:italic;
  font-weight:500;
  color:var(--ink);
}
.completion-modal p{
  margin:0 auto 9px;
  color:var(--mid);
  font-size:14.5px;
  line-height:1.6;
}
.completion-modal .btn{margin-top:12px;min-width:138px;}
@media(max-width:700px){
  .completion-modal{padding:25px 19px 21px;border-radius:20px;}
  .completion-modal h2{font-size:25px;}
}

/* Calm Tax v47: focused active checklist, progress ring, and immediate completion feedback */
.checklist-progress-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:2px auto 24px;text-align:center;}
.progress-ring{position:relative;width:118px;height:118px;margin:0 auto 12px;}
.progress-ring svg{width:118px;height:118px;display:block;transform:rotate(-90deg);}
.progress-ring-track,.progress-ring-value{fill:none;stroke-width:8;}
.progress-ring-track{stroke:rgba(125,142,126,.15);}
.progress-ring-value{stroke:var(--sage);stroke-linecap:round;transition:stroke-dashoffset .55s ease;}
.progress-ring-percent{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Lora,serif;font-size:27px;font-weight:500;color:var(--ink);}
.progress-ring-message{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-style:italic;font-weight:500;color:var(--ink);line-height:1.2;margin-bottom:3px;}
.progress-ring-count{font-size:13px;color:var(--mid);line-height:1.4;}
.checklist-list{display:block;}
.checklist-list .group-block{margin:28px 0;transition:opacity .2s ease,filter .2s ease,transform .2s ease,box-shadow .2s ease;}
.checklist-list.focus-mode .group-block:not(.focus-active){opacity:.58;filter:saturate(.78);box-shadow:none;}
.checklist-list.focus-mode .group-block.focus-active{transform:translateY(-1px);}
.group-items{padding-top:20px!important;padding-bottom:8px!important;}
.item.row-upload{margin-bottom:18px!important;}
.entry-card.entry-card-collapsed.open .entry-inner{margin-top:14px!important;}
.group-progress{white-space:nowrap;}
.completed-archive{margin:34px 0 8px;border:1px solid rgba(125,142,126,.20);border-radius:18px;background:rgba(255,255,255,.58);overflow:hidden;}
.completed-archive summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(125,142,126,.07);font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-style:italic;font-weight:600;color:var(--ink);}
.completed-archive summary::-webkit-details-marker{display:none;}
.completed-archive summary::after{content:"▾";font-family:Inter,sans-serif;font-style:normal;font-size:13px;color:var(--sage);transition:transform .18s ease;}
.completed-archive[open] summary::after{transform:rotate(180deg);}
.completed-archive-inner{padding:18px 18px 4px;}
.completed-category{margin:0 0 24px;}
.completed-category:last-child{margin-bottom:8px;}
.completed-category-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-style:italic;font-weight:600;color:rgba(60,54,51,.78);margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid rgba(60,54,51,.09);}
.completed-archive .item.row-upload{margin-bottom:10px!important;}
.completion-modal.loading .completion-modal-icon{background:transparent;}
.completion-modal-spinner{width:32px;height:32px;border-radius:50%;border:3px solid rgba(125,142,126,.18);border-top-color:var(--sage);animation:spin .8s linear infinite;display:block;}
.completion-modal.loading .btn{display:none;}
.completion-modal.loading p{max-width:330px;}
.item.completing{opacity:.68;pointer-events:none;transition:opacity .18s ease;}
.entry-save.completing{min-width:154px;}
.category-complete-line{font-weight:700!important;color:var(--sage)!important;margin-top:12px!important;}
/* Calm Tax v48: move completed work into a quiet archive with a graceful handoff */
.item.row-upload.item-moving-to-completed{
  opacity:.18!important;
  transform:translateY(8px) scale(.985)!important;
  max-height:0!important;
  margin-top:0!important;
  margin-bottom:0!important;
  padding-top:0!important;
  padding-bottom:0!important;
  border-width:0!important;
  overflow:hidden!important;
  transition:opacity .34s ease,transform .34s ease,max-height .48s ease,margin .48s ease,padding .48s ease,border-width .48s ease!important;
}
.group-block.category-finishing{
  border-color:rgba(125,142,126,.42)!important;
  background:rgba(125,142,126,.07)!important;
  box-shadow:0 10px 28px rgba(60,54,51,.055)!important;
  transition:border-color .28s ease,background .28s ease,box-shadow .28s ease,opacity .42s ease,transform .42s ease!important;
}
.group-block.category-finishing .group-summary{background:rgba(125,142,126,.13)!important;}
.group-block.category-finishing .group-progress{color:var(--sage)!important;}
.group-block.category-finishing .group-symbol{background:var(--sage)!important;}
.group-block.category-finishing.category-leaving{opacity:0;transform:translateY(8px);}
.completed-archive{scroll-margin-top:22px;}

@media(max-width:700px){
  .progress-ring,.progress-ring svg{width:106px;height:106px;}
  .progress-ring-percent{font-size:25px;}
  .progress-ring-message{font-size:21px;}
  .checklist-list .group-block{margin:24px 0;}
  .group-items{padding-top:17px!important;}
  .item.row-upload{margin-bottom:16px!important;}
  .completed-archive summary{font-size:21px;padding:15px 16px;}
  .completed-archive-inner{padding:15px 14px 3px;}
}



/* Calm Tax v49: immediate manual-completion feedback and clearer selectable circles */
.check{
  cursor:pointer;
  transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.item.row-upload:not(.checked) .check:hover,
.item.row-upload:not(.checked) .check:focus-visible{
  background:rgba(125,142,126,.11);
  border-color:var(--sage);
  color:rgba(125,142,126,.72);
  box-shadow:0 0 0 5px rgba(125,142,126,.10),0 4px 12px rgba(60,54,51,.07);
  transform:translateY(-1px) scale(1.05);
  outline:none;
}
.item.row-upload:not(.checked) .check:active{transform:scale(.96);}
.item.row-upload.manual-completing .check{
  background:rgba(125,142,126,.12);
  color:var(--sage);
  box-shadow:0 0 0 5px rgba(125,142,126,.08);
}
.completion-modal.error .completion-modal-icon{
  background:rgba(166,109,94,.11);
  color:var(--clay);
  font-size:20px;
}

function collectEntryValues(idx){

  const values={};
  if(!card)return values;
  card.querySelectorAll('[data-entry-field]').forEach(function(input){
    const key=input.getAttribute('data-entry-field');
    if(key)values[key]=input.value||'';
  });
  return values;

function entryInputsForIndex(idx){

  return Array.from(panel.querySelectorAll('[data-entry-field]')).filter(function(input){
    const row=input.closest('.dependent-tax-row');

function inputHasValue(input){return !!String((input&&input.value)||'').trim();}
function updateFieldCompletion(idx){
  entryInputsForIndex(idx).forEach(function(input){
    const field=input.closest('.entry-field');
    if(!field)return;

    if(inputHasValue(input))field.classList.remove('field-missing');
  });
  const confirm=document.getElementById('entry-'+idx+'-confirmAccountNumber');

    if(field){field.classList.toggle('field-complete',inputHasValue(confirm));if(inputHasValue(confirm))field.classList.remove('field-missing');}

}
function missingEntryInputs(idx){

function validateEntry(idx){
  const values=collectEntryValues(idx);
  const validation=document.getElementById('entryValidation-'+idx);
  updateFieldCompletion(idx);
  if(!validation)return true;
  validation.className='entry-validation';
  validation.textContent='';
  const label=state&&state.items&&state.items[idx]?cleanItemLabel(state.items[idx]).toLowerCase():'';
  if(label.includes('bank')||label.includes('routing')){
    const routing=String(values.routingNumber||'').replace(/\D/g,'');
    const account=String(values.accountNumber||'');
    const confirm=document.getElementById('entry-'+idx+'-confirmAccountNumber');
    const confirmValue=confirm?String(confirm.value||''):account;
    if(routing&&routing.length!==9){validation.classList.add('attn');validation.textContent='Routing numbers are usually 9 digits.';return false;}
    if(account||confirmValue){
      if(account!==confirmValue){validation.classList.add('attn');validation.textContent='Account numbers do not match yet.';return false;}
      if(account===confirmValue&&account){validation.classList.add('ok');validation.textContent=routing?'Looks good. Account numbers match.':'Account numbers match.';return true;}
    }
    if(routing&&routing.length===9){validation.classList.add('ok');validation.textContent='9-digit routing number entered.';return true;}
  }
  return true;
}

function setCompletionModalState(options){
  pendingCompletion=Object.assign({},pendingCompletion||{},options||{});
  const backdrop=document.getElementById('completionModal');
  const box=document.getElementById('completionModalBox');
  if(!backdrop||!box)return;
  const stage=pendingCompletion.stage||(pendingCompletion.warning?'warning':'success');
  const warning=stage==='warning';
  const loading=stage==='loading';
  box.classList.toggle('warning',warning);
  box.classList.toggle('loading',loading);
  const icon=document.getElementById('completionModalIcon');
  const title=document.getElementById('completionModalTitle');
  const lead=document.getElementById('completionModalLead');
  const detail=document.getElementById('completionModalDetail');
  const category=document.getElementById('completionModalCategory');

  if(loading){
    icon.innerHTML='<span class="completion-modal-spinner" aria-hidden="true"></span>';
    title.textContent='Completing Item';
    lead.textContent='Saving your information...';
    detail.textContent='Please wait a moment.';
    category.hidden=true;
    button.disabled=true;
  }else if(stage==='error'){
    box.classList.remove('warning','loading');
    box.classList.add('error');
    icon.textContent='!';
    title.textContent='Could not complete item';
    lead.textContent='Your selection was not saved.';
    detail.textContent='Please close this message and try again.';
    category.hidden=true;
    button.disabled=false;

    box.classList.remove('error');
    icon.textContent='!';
    title.textContent='A few details are still needed';
    lead.textContent='Please complete the highlighted fields or upload a document instead.';
    detail.textContent='';
    category.hidden=true;
    button.disabled=false;
  }else{
    box.classList.remove('error');
    icon.textContent='✓';
    title.textContent='Item Complete';
    lead.textContent='This item has moved to the bottom of your checklist.';
    detail.textContent='You can edit it there anytime before your return enters Preparation.';

function scheduleEntryAutosave(idx){

async function autosaveChecklistEntry(idx,options){
  options=options||{};
  clearTimeout(entryAutosaveTimers[idx]);
  const requestId=(entryAutosaveRequests[idx]||0)+1;
  entryAutosaveRequests[idx]=requestId;
  const validation=document.getElementById('entryValidation-'+idx);
  if(validation&&!options.silent){validation.className='entry-validation';validation.innerHTML='<span class="mini-spinner"></span>Saving...';}
  const promise=(async function(){
    try{
      const values=collectEntryValues(idx);
      const result=await api({form_type:'saveChecklistEntry',clientId:CLIENT_ID,itemIndex:idx,values:values,markComplete:false});
      if(entryAutosaveRequests[idx]!==requestId)return result;
      state.entryValues=state.entryValues||{};
      state.entryValues[String(idx)]=result.values||values;
      if(validation&&!options.silent){validation.className='entry-validation ok';validation.textContent='Saved';}
      return result;
    }catch(error){
      if(entryAutosaveRequests[idx]===requestId&&validation&&!options.silent){validation.className='entry-validation attn';validation.textContent='Could not auto-save. Please try again.';}
      throw error;
    }finally{
      if(entryAutosavePromises[idx]===promise)delete entryAutosavePromises[idx];
    }
  })();
  entryAutosavePromises[idx]=promise;
  return promise;
}

  }

async function saveChecklistEntry(idx,event){
  if(event){event.preventDefault();event.stopPropagation();}
  idx=Number(idx);
  if(completionLocks[idx])return;
  const readiness=entryIsReadyToComplete(idx);
  if(!readiness.ready){
    openCompletionModal({stage:'warning',warning:true,idx:idx,missing:readiness.missing});
    return;
  }
  completionLocks[idx]=true;
  setEntryCompletingState(idx,true);

function groupBlockHtml(cat,group,body,open){
  const info=groupProgressInfo(group);
  return '<div class="group-block '+info.cls+(open?'':' collapsed')+'" data-category="'+esc(cat)+'"><button class="group-summary" type="button" onclick="toggleChecklistGroup(this,event)"><span class="group-name">'+esc(cat)+'</span><span class="group-progress"><span class="group-symbol">'+info.symbol+'</span>'+esc(info.text)+' <span class="group-chevron">▾</span></span></button><div class="group-items">'+body+'</div></div>';
}
function toggleChecklistGroup(btn,event){
  if(event)event.stopPropagation();
  const block=btn&&btn.closest?btn.closest('.group-block'):null;
  if(!block)return;
  const list=document.getElementById('checklistList');
  const opening=block.classList.contains('collapsed');
  if(list){
    list.querySelectorAll('.group-block').forEach(function(group){
      group.classList.remove('focus-active');
      if(group!==block&&opening)group.classList.add('collapsed');
    });
  }
  block.classList.toggle('collapsed',!opening);
  block.classList.toggle('focus-active',opening);
  if(list)list.classList.toggle('focus-mode',opening);
}
function progressMessage(completed,total){
  if(!total)return 'Let’s get started.';
  const pct=completed/total;
  if(pct>=1)return 'Everything is complete.';
  if(pct>=.8)return 'Just a few items left.';
  if(pct>=.5)return 'More than halfway there.';
  if(pct>=.2)return 'Nice progress.';
  return 'You’re off to a great start.';
}
function progressRingHtml(completed,total){
  const pct=total?Math.round((completed/total)*100):0;
  const radius=49;
  const circumference=2*Math.PI*radius;
  const offset=circumference-(circumference*(pct/100));
  return '<div class="checklist-progress-wrap"><div class="progress-ring" role="img" aria-label="'+pct+' percent complete"><svg viewBox="0 0 118 118" aria-hidden="true"><circle class="progress-ring-track" cx="59" cy="59" r="'+radius+'"></circle><circle class="progress-ring-value" cx="59" cy="59" r="'+radius+'" stroke-dasharray="'+circumference.toFixed(2)+'" stroke-dashoffset="'+offset.toFixed(2)+'"></circle></svg></div><div class="progress-ring-message">'+esc(progressMessage(completed,total))+'</div><div class="progress-ring-count">'+completed+' of '+total+' complete</div></div>';
}
function completedArchiveHtml(groups,order,total){
  if(!total)return '';
  let inner='';
  order.forEach(function(cat){
    const group=groups[cat];
    if(!group||!group.length)return;
    inner+='<section class="completed-category"><h3 class="completed-category-title">'+esc(cat)+'</h3>'+group.map(function(row){return itemHtml(row.item,row.idx);}).join('')+'</section>';
  });
  return '<details class="completed-archive"><summary>Completed ('+total+')</summary><div class="completed-archive-inner">'+inner+'</div></details>';
}
function render(){
  if(!state)return;
  const visibleItems=visibleChecklistItems();
  const items=visibleItems.map(function(row){return row.item;});
  const activeGroups={};
  const completedGroups={};
  const order=['Identity & Prior Return','Income Documents','Business & Deduction Records','Personal Deductions & Credits','Other Tax Items','Additional Documents'];
  visibleItems.forEach(function(row){
    const cat=categoryFor(row.item);
    const target=checked.has(Number(row.idx))?completedGroups:activeGroups;
    if(!target[cat])target[cat]=[];
    target[cat].push({item:row.item,idx:row.idx});
  });
  let checklistHtml='';
  let activeNumber=0;
  order.forEach(function(cat){
    const group=activeGroups[cat];
    if(!group||!group.length)return;
    const body=group.map(function(row){return itemHtml(row.item,row.idx);}).join('');
    checklistHtml+=groupBlockHtml(cat,group,body,activeNumber===0);
    activeNumber++;
  });
  if(!checklistHtml)checklistHtml='<div class="privacy" style="text-align:center;border-left:0;border-radius:14px;"><strong>Everything on your checklist is complete.</strong></div>';
  const doneCount=visibleItems.filter(function(row){return checked.has(Number(row.idx));}).length;
  const archiveHtml=completedArchiveHtml(completedGroups,order,doneCount);
  const firstName=((state.name||'').split(' ')[0]||'there');
  const otherFiles=(state.uploadedFiles||[]).filter(function(f){return f.checklistIndex===''||f.checklistIndex===null||f.checklistIndex===undefined;}).map(fileHtml).join('');
  const ready=isReturnReadyMode();
  const complete=isCompleteMode();
  document.title=complete?'Your Tax Return Is Complete | Calm Tax Co.':(ready?'Review Your Tax Return | Calm Tax Co.':'Calm Tax Co. Tax Checklist & Documents');
  let html='<div class="brand"><div class="brand-left"><div>'+logo()+'</div><div class="secure-header-note"><svg class="secure-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.4 2.8 8.4 7 10 4.2-1.6 7-5.6 7-10V6z"/><path d="m9.5 12 1.7 1.7 3.8-4"/></svg><span>Secure upload page</span></div></div><div class="year"><div class="year-label">Tax Year</div><div class="year-num">2025</div></div></div>'+(complete?'':journeyHtml());
  if(complete){html+='<h1 class="title">Your Tax Return<br>Is Complete</h1>'+returnReviewHtml();}
  else if(ready){html+='<h1 class="title">Review<br>Your Tax Return</h1>'+returnReviewHtml()+signed8879UploadHtml()+originalChecklistDetailsHtml(checklistHtml+archiveHtml,items);}
  else{
    html+='<h1 class="title checklist-title"><span class="client-name">Hi '+esc(firstName)+',</span><span class="checklist-subtitle">Your personalized upload checklist is below.</span></h1>'+checklistIntroHtml(firstName)+(state.uploadsLockedMessage?'<div class="privacy lock-note"><strong>Uploads locked:</strong> '+esc(state.uploadsLockedMessage)+'</div>':'')+'<div class="card"><div class="checklist-card-header">'+progressRingHtml(doneCount,items.length)+'<p class="checklist-card-instructions">For each item, upload a document or enter the information directly when available. You can manually check or uncheck items anytime.</p></div><div id="checklistList" class="checklist-list">'+checklistHtml+'</div>'+archiveHtml+normalOtherUploadHtml(otherFiles)+'</div>';
  }
  html+=completionModalHtml()+privacyHtml()+'<div class="contact-card"><span class="contact-icon"><svg class="icon-inline" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="m4 7 8 6 8-6"/></svg></span><span>Questions? Reply to your checklist email or contact us at <a class="contact-email" href="mailto:hello@calmtax.co">hello@calmtax.co</a>.</span></div><p class="footer-note">© 2026 Calm Tax Co.</p>';
  document.getElementById('app').innerHTML=html;
}
function completedCount(){return visibleChecklistItems().filter(function(row){return checked.has(row.idx);}).length;}
async function toggleChecklistItem(idx,event){
  if(event)event.stopPropagation();
  idx=Number(idx);
  if(Number.isNaN(idx)||completionLocks[idx])return;
  const wasComplete=checked.has(idx);
  if(wasComplete){
    checked.delete(idx);
    render();
    try{await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});}catch(error){console.error(error);}
    return;
  }

  completionLocks[idx]=true;
  checked.add(idx);
  const row=document.querySelector('.item.row-upload[data-idx="'+idx+'"]');
  if(row)row.classList.add('manual-completing');
  openCompletionModal({stage:'loading',idx:idx,method:'manual'});

  try{
    await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});
    setCompletionModalState({
      stage:'success',
      idx:idx,
      method:'manual',
      categoryComplete:categoryIsCompleteForIndex(idx),
      categoryName:categoryNameForIndex(idx)
    });
  }catch(error){
    checked.delete(idx);
    console.error(error);
    setCompletionModalState({stage:'error',idx:idx,method:'manual'});
  }finally{
    completionLocks[idx]=false;
    const fresh=document.querySelector('.item.row-upload[data-idx="'+idx+'"]');
    if(fresh)fresh.classList.remove('manual-completing');
  }
}

function setRowStatus(idx,type,message){const el=document.getElementById('rowStatus-'+idx);if(!el)return;const icon=type==='loading'?'<span class="mini-spinner"></span>':type==='success'?'<span class="upload-check">✓</span>':'';el.innerHTML=icon+esc(message||'');}
function formatFileSize(bytes){if(!bytes)return '0 KB';const kb=bytes/1024;if(kb<1024)return Math.round(kb)+' KB';return (kb/1024).toFixed(1)+' MB';}
function readFileAsDataURL(file){return new Promise(function(resolve,reject){const r=new FileReader();r.onload=function(){resolve(r.result);};r.onerror=function(){reject(new Error('Could not read '+file.name));};r.readAsDataURL(file);});}
async function load(){try{if(!CLIENT_ID)throw new Error('Missing checklist link code.');state=await api({form_type:'getChecklist',clientId:CLIENT_ID});checked=new Set((state.checkedIndexes||[]).map(Number));render();}catch(e){document.getElementById('app').innerHTML='<div class="err"><strong>The checklist could not load.</strong><br>'+esc(e.message)+'<br><br>Please refresh the page. If the problem continues, contact hello@calmtax.co.</div>';}}
function openRowFilePicker(idx,event,mode){if(event)event.stopPropagation();const id=mode==='camera'?'rowCameraInput-':'rowFileInput-';const input=document.getElementById(id+idx);if(input)input.click();}
function handleRowFileInput(idx,event){const files=Array.from(event.target.files||[]);event.target.value='';if(files.length)uploadFilesForChecklistItem(idx,files);}
function rowDragEnter(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('drag-over');}
function rowDragOver(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('drag-over');}
function rowDragLeave(e,idx){e.preventDefault();e.stopPropagation();const row=e.currentTarget;if(!row||row.contains(e.relatedTarget))return;row.classList.remove('drag-over');}
function rowDrop(e,idx){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drag-over');const files=Array.from(e.dataTransfer&&e.dataTransfer.files?e.dataTransfer.files:[]);if(files.length)uploadFilesForChecklistItem(idx,files);}
function openOtherFilePicker(e){if(e)e.stopPropagation();const input=document.getElementById('otherFileInput');if(input)input.click();}
function handleOtherFileInput(e){const files=Array.from(e.target.files||[]);e.target.value='';if(files.length)uploadFilesAsOther(files);}
function otherDragEnter(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.add('drag-over');}
function otherDragOver(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.add('drag-over');}
function otherDragLeave(e){e.preventDefault();e.stopPropagation();const row=document.getElementById('otherUploadRow');if(!row||row.contains(e.relatedTarget))return;row.classList.remove('drag-over');}
function otherDrop(e){e.preventDefault();e.stopPropagation();document.getElementById('otherUploadRow').classList.remove('drag-over');const files=Array.from(e.dataTransfer&&e.dataTransfer.files?e.dataTransfer.files:[]);if(files.length)uploadFilesAsOther(files);}
async function uploadFilesForChecklistItem(idx,files){const button=document.getElementById('uploadBtn-'+idx);if(button)button.disabled=true;try{for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus(idx,'loading',prefix+'Uploading '+originalFile.name+' ('+formatFileSize(originalFile.size)+')…');const dataUrl=await readFileAsDataURL(originalFile);const label=selectedLabelForIndex(idx);const cleanLabel=cleanDocLabel(label);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:label,docTypeLabel:cleanLabel,checklistIndex:idx}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:idx,docTypeLabel:cleanLabel});}checked.add(Number(idx));await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});openCompletionModal({stage:'success',warning:false,idx:Number(idx),method:'upload',categoryComplete:categoryIsCompleteForIndex(Number(idx)),categoryName:categoryNameForIndex(Number(idx))});}catch(error){setRowStatus(idx,'error','Upload failed: '+error.message);}finally{const fresh=document.getElementById('uploadBtn-'+idx);if(fresh)fresh.disabled=false;}}
async function uploadFilesAsOther(files){try{const returnReady=isReturnReadyMode();const docLabel=returnReady?'Signed Form 8879':'Other Documents';for(let i=0;i<files.length;i++){const originalFile=files[i];const prefix=files.length>1?'File '+(i+1)+' of '+files.length+': ':'';setRowStatus('other','loading',prefix+'Uploading '+originalFile.name+'…');const dataUrl=await readFileAsDataURL(originalFile);const result=await api({form_type:'uploadFile',clientId:CLIENT_ID,file:{name:originalFile.name,mimeType:originalFile.type||'application/octet-stream',dataUrl:dataUrl,docType:docLabel,docTypeLabel:docLabel,checklistIndex:''}});if(!state.uploadedFiles)state.uploadedFiles=[];state.uploadedFiles.push({name:result.fileName||originalFile.name,id:result.fileId||'',timestamp:new Date().toISOString(),checklistIndex:'',docTypeLabel:docLabel});}render();setRowStatus('other','success',returnReady?'Form 8879 uploaded successfully.':(files.length>1?files.length+' files uploaded.':'Upload complete.'));}catch(error){setRowStatus('other','error','Upload failed: '+error.message);}}
function deleteFile(fileId,event){event.stopPropagation();if(!fileId||state.canDeleteFiles===false)return;const button=event.currentTarget;const row=button?button.closest('.row-file'):null;if(!row)return;document.querySelectorAll('.delete-confirm').forEach(function(p){p.remove();});document.querySelectorAll('.confirming-delete').forEach(function(el){el.classList.remove('confirming-delete');});const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const name=rec?(clientDisplayFileName(rec)||'this file'):'this file';row.classList.add('confirming-delete');const panel=document.createElement('div');panel.className='delete-confirm';panel.innerHTML='<div>Delete “'+esc(name)+'”? This cannot be undone.</div><div class="delete-confirm-actions"><button type="button" class="delete-confirm-cancel">Cancel</button><button type="button" class="delete-confirm-ok">Delete file</button></div>';row.appendChild(panel);panel.querySelector('.delete-confirm-cancel').onclick=function(e){e.stopPropagation();panel.remove();row.classList.remove('confirming-delete');};panel.querySelector('.delete-confirm-ok').onclick=function(e){e.stopPropagation();confirmDeleteFile(fileId,row,button,e.currentTarget);};}
async function confirmDeleteFile(fileId,row,originalButton,confirmButton){const rec=(state.uploadedFiles||[]).find(function(f){return String(f.id)===String(fileId);});const deletedIndex=rec&&rec.checklistIndex!==undefined&&rec.checklistIndex!==''?Number(rec.checklistIndex):null;row.classList.add('deleting');if(originalButton)originalButton.disabled=true;if(confirmButton){confirmButton.disabled=true;confirmButton.innerHTML='<span class="mini-spinner"></span>Deleting...';}try{await api({form_type:'deleteFile',clientId:CLIENT_ID,fileId:fileId});state.uploadedFiles=(state.uploadedFiles||[]).filter(function(f){return String(f.id)!==String(fileId);});if(deletedIndex!==null&&!Number.isNaN(deletedIndex)){const still=state.uploadedFiles.some(function(f){return Number(f.checklistIndex)===Number(deletedIndex);});if(!still){checked.delete(deletedIndex);await api({form_type:'saveChecklistState',clientId:CLIENT_ID,checkedIndexes:Array.from(checked)});}}render();}catch(error){row.classList.remove('deleting');if(originalButton)originalButton.disabled=false;if(confirmButton){confirmButton.disabled=false;confirmButton.textContent='Delete file';}const p=row.querySelector('.delete-confirm div');if(p)p.textContent='Delete failed: '+error.message;}}
function openSignHelpModal(event){if(event)event.stopPropagation();const modal=document.getElementById('signHelpModal');if(modal)modal.classList.add('open');}
function closeSignHelpModal(event){if(event)event.stopPropagation();const modal=document.getElementById('signHelpModal');if(modal)modal.classList.remove('open');}
function showDeviceHelp(device,event){if(event)event.stopPropagation();document.querySelectorAll('.device-btn').forEach(function(btn){btn.classList.remove('active');});if(event&&event.currentTarget)event.currentTarget.classList.add('active');document.querySelectorAll('.device-panel').forEach(function(panel){panel.classList.remove('active');});const panel=document.getElementById('device-'+device);if(panel)panel.classList.add('active');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSignHelpModal(e);});
window.addEventListener('error',function(e){const app=document.getElementById('app');if(app&&app.textContent.indexOf('Loading your checklist')!==-1){app.innerHTML='<div class="err"><strong>The checklist could not load.</strong><br>'+esc(e.message||'A page error occurred.')+'<br><br>Please refresh the page. If the problem continues, contact hello@calmtax.co.</div>';}});
load();
</script>
