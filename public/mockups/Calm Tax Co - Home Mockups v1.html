<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Calm Tax Co. — Home Mockups v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@200;300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#f0eee9; font-family:'Inter', system-ui, sans-serif; }
  body, #root { width:100vw; height:100vh; overflow:hidden; }

  /* tokens */
  :root {
    --sand:        #F4F0E8;
    --sand-deep:   #ECE6DA;
    --paper:       #FBF8F2;
    --paper-warm:  #F9F4EA;
    --ink:         #2B2724;
    --ink-soft:    #3C3633;
    --ink-mute:    #5D5751;
    --slate:       #6E6962;
    --sage:        #7D8E7E;
    --sage-deep:   #5E6F5F;
    --sage-mist:   #C9D2C7;
    --terracotta:  #A66D5E;
    --terracotta-deep: #8A5749;
    --rule:        rgba(43,39,36,0.18);
    --rule-soft:   rgba(43,39,36,0.10);
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared-v1.jsx"></script>
  <script type="text/babel" src="mockup-quiet-letter-v1.jsx"></script>
  <script type="text/babel" src="mockup-atelier-v1.jsx"></script>
  <script type="text/babel" src="mockup-modernist-v1.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { QuietLetter, Atelier, Modernist } = window;

    function App() {
      return (
        <DesignCanvas storageKey="calm-tax-home-mockups-v1">
          <DCSection id="home" title="Home page — three directions" subtitle="All three use the rewritten copy + new sections (personas, ‘not the right fit yet,’ moved-up breathing widget). Wabi-sabi modern spa, three different expressions.">
            <DCArtboard id="letter" label="01 · The Quiet Letter — small-press editorial" width={1440} height={10400}>
              <QuietLetter />
            </DCArtboard>
            <DCArtboard id="atelier" label="02 · Atelier — image-led, warm washes" width={1440} height={11400}>
              <Atelier />
            </DCArtboard>
            <DCArtboard id="modernist" label="03 · Negative Space — modernist, quiet grid" width={1440} height={10100}>
              <Modernist />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
