<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Payment | Calm Tax Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--bg2:#f4f1ea;--white:#fff;--ink:#3C3633;--mid:#4A545C;--sage:#7D8E7E;--clay:#A66D5E;--border:rgba(60,54,51,.12);--success:#2e7d32;--danger:#8a3434;--warning:#8a6a24;--r:14px;--rl:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:980px;margin:0 auto;padding:32px 18px 80px}.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:24px;gap:16px}.logo-svg{width:260px;max-width:58vw;height:auto;display:block}.year{text-align:right}.year-label{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--mid);opacity:.65}.year-num{font-family:Lora,serif;font-size:34px}.journey{margin:28px 0 12px;padding:18px 18px 20px}.journey-title{text-align:center;font-family:Lora,serif;font-size:21px;font-style:italic;margin:0 0 18px;color:var(--ink)}.journey-track{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}.journey-track::before{content:"";position:absolute;left:12%;right:12%;top:19px;height:1.5px;border-top:2px dashed rgba(125,142,126,.28);z-index:0}.journey-step{position:relative;z-index:1;flex:1;text-align:center;color:var(--mid)}.journey-dot{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:Lora,serif;font-size:15px;font-weight:700;box-shadow:0 0 0 6px var(--bg),0 2px 8px rgba(60,54,51,.06);margin-bottom:9px}.journey-label{display:block;font-family:Lora,serif;font-size:16px;line-height:1.35;font-weight:500;color:var(--ink)}.journey-step.done .journey-dot{background:var(--sage);border-color:var(--sage);color:#fff}.journey-step.current .journey-dot{background:var(--sage);border-color:var(--sage);color:#fff;transform:scale(1.08);box-shadow:0 0 0 7px var(--bg),0 2px 10px rgba(125,142,126,.18)}.journey-note{display:block;width:max-content;margin:7px auto 0;padding:4px 10px;border-radius:999px;background:rgba(125,142,126,.12);color:var(--sage);font-family:Inter,sans-serif;font-size:11px;font-weight:600}.title{text-align:center;font-family:Lora,serif;font-style:italic;font-size:44px;line-height:1.1;font-weight:400;margin:34px auto 10px;border-top:1px solid var(--border);padding-top:32px}.intro{text-align:center;max-width:720px;margin:0 auto 30px;font-family:Lora,serif;font-size:17px;line-height:1.65;color:var(--mid)}.payment-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:0 4px 16px rgba(60,54,51,.035);padding:28px 26px 34px;margin:24px auto 16px;max-width:680px;text-align:center}.quote-box{border:1px solid rgba(125,142,126,.24);background:rgba(125,142,126,.045);border-radius:18px;padding:22px 20px;text-align:center;margin:0 auto 22px;max-width:560px}.quote-description{font-family:Lora,serif;font-size:20px;line-height:1.45;margin:0 auto 12px;max-width:460px;color:var(--ink)}.quote-amount{font-family:Lora,serif;font-size:34px;line-height:1;color:var(--ink);font-weight:400}.approval-box{max-width:560px;margin:18px auto 18px;padding:14px 15px;border:1px solid rgba(60,54,51,.12);border-radius:14px;background:rgba(255,255,255,.72);text-align:left}.approval-label{display:flex;align-items:flex-start;gap:10px;color:var(--mid);font-size:13px;line-height:1.55;cursor:pointer}.approval-label input{margin-top:3px;width:16px;height:16px;accent-color:var(--sage);flex:0 0 auto}.approval-label a{color:var(--sage);font-weight:600;text-decoration:none}.approval-label a:hover{text-decoration:underline}.btn{font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:var(--ink);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;min-width:min(100%,260px)}.btn:hover{background:var(--sage)}.btn:disabled{opacity:.48;cursor:not-allowed;background:rgba(60,54,51,.55)}.stripe-wordmark{font-weight:800;letter-spacing:-.03em;text-transform:none;font-size:16px}.checkout-word{opacity:.9}.microcopy{margin:12px auto 0;color:var(--mid);font-size:13px;line-height:1.55;max-width:460px}.status-note{border-left:4px solid var(--sage);background:var(--bg2);border-radius:0 var(--r) var(--r) 0;padding:16px 18px 16px 24px;font-size:14px;line-height:1.65;color:var(--mid);margin:22px 0}.status-note.error{border-left-color:#d39b9b;background:#fff7f7;color:var(--danger)}.status-note.success{border-left-color:var(--success);background:#f2faf2;color:#285b2b}.status-note.warning{border-left-color:#d6aa4d;background:#fff8ea;color:var(--warning)}.contact-card{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px auto 0;padding:18px 20px;max-width:680px;border:1px solid rgba(125,142,126,.20);border-radius:16px;background:rgba(255,255,255,.58);color:var(--mid);font-size:14px;line-height:1.5;text-align:center}.contact-icon{width:34px;height:34px;border-radius:50%;background:rgba(125,142,126,.12);color:var(--sage);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px}.contact-card a{color:var(--sage);font-weight:600;text-decoration:none}.contact-email{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.18em;font-weight:500;letter-spacing:.01em}.footer-note{text-align:center;color:rgba(74,84,92,.72);font-size:12px;margin:26px 0 0}.loading{text-align:center;padding:70px 20px;color:var(--mid);font-family:Lora,serif;font-size:20px}.spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(125,142,126,.22);border-top-color:var(--sage);animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.brand{align-items:flex-start}.title{font-size:34px}.payment-card{padding:22px 14px 30px}.quote-amount{font-size:30px}.journey{padding-left:6px;padding-right:6px}.journey-track{gap:4px}.journey-track::before{top:16px;left:12%;right:12%}.journey-dot{width:34px;height:34px;font-size:13px}.journey-label{font-size:14px}.contact-card{align-items:flex-start;text-align:left}}
</style>
</head>
<body>
<div class="wrap"><div id="app"><div class="loading"><div class="spinner"></div>Loading your payment page…</div></div></div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbxIqzdrwed8JgxdUUMMtTqVUQDmEmChlm7411oMGUUAF4Jn_8HinPHNDmNwZKb6vddiXg/exec';
const SUPPORT_EMAIL='hello@calmtax.co';
const params=new URLSearchParams(location.search);
const CLIENT_ID=params.get('c')||params.get('client')||params.get('payment');
const SESSION_ID=params.get('session_id');
const RETURN_STATUS=params.get('status')||'';
let paymentState=null;
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function money(v,currency){const amount=Number(v||0);try{return new Intl.NumberFormat('en-US',{style:'currency',currency:currency||'USD',maximumFractionDigits:amount%1===0?0:2}).format(amount);}catch(e){return '$'+amount.toFixed(2);}}
async function api(payload){const controller=new AbortController();const timeoutId=setTimeout(function(){controller.abort();},30000);let response;try{response=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:controller.signal});}catch(error){if(error&&error.name==='AbortError')throw new Error('The payment server took too long to respond. Please refresh and try again.');throw error;}finally{clearTimeout(timeoutId);}const text=await response.text();let data;try{data=JSON.parse(text);}catch(error){throw new Error('Unexpected server response.');}if(!data||data.status==='error')throw new Error(data&&data.message?data.message:'Request failed.');return data;}
function logoHtml(){return '<svg viewBox="15 22 390 108" fill="none" class="logo-svg" xmlns="http://www.w3.org/2000/svg"><text x="46" y="92" font-family="Cormorant Garamond, Georgia, serif" font-size="96" font-weight="300" font-style="italic" fill="#2A2A2A">Calm</text><line x1="272" y1="38" x2="272" y2="100" stroke="#C4BDB3" stroke-width="1.6"></line><text x="288" y="65" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">TAX</text><text x="288" y="92" font-family="Inter, Helvetica Neue, sans-serif" font-size="20" font-weight="400" letter-spacing="6" fill="#9A9590">CO.</text><path d="m 18.361809,116.41876 q 94.000001,-12 196.000001,0 102,12 174,0" stroke="#9a9590" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>';}
function pageShell(inner, options){options=options||{};const paid=options.paid===true;const taxYear=(paymentState&&paymentState.taxYear)||'2025';const title=paid?'Payment Received':'Review & Pay Your Quote';const step3Class=paid?'done':'current';const step4Class=paid?'current':'';const step3Dot=paid?'✓':'3';const step3Note=paid?'':'<br><span class="journey-note">You are here</span>';const step4Note=paid?'<br><span class="journey-note">You are here</span>':'';return '<div class="brand"><div>'+logoHtml()+'</div><div class="year"><div class="year-label">Tax Year</div><div class="year-num">'+esc(taxYear)+'</div></div></div><div class="journey"><div class="journey-title">Your tax return progress</div><div class="journey-track"><div class="journey-step done"><div class="journey-dot">✓</div><span class="journey-label">Short Intake</span></div><div class="journey-step done"><div class="journey-dot">✓</div><span class="journey-label">Gather &amp; Upload</span></div><div class="journey-step '+step3Class+'"><div class="journey-dot">'+step3Dot+'</div><span class="journey-label">Quote &amp; Pay'+step3Note+'</span></div><div class="journey-step '+step4Class+'"><div class="journey-dot">4</div><span class="journey-label">Prepare &amp; E-file'+step4Note+'</span></div></div><div class="title">'+title+'</div></div>'+inner+'<div class="contact-card"><span class="contact-icon">✉</span><span>Questions? Feel free to reach out at <a class="contact-email" href="mailto:'+SUPPORT_EMAIL+'">'+SUPPORT_EMAIL+'</a></span></div><div class="footer-note">© 2026 Calm Tax Co. All rights reserved.</div>';}
function renderError(message){document.getElementById('app').innerHTML=pageShell('<div class="status-note error"><strong>This payment page could not load.</strong><br>'+esc(message)+'<br><br>Please refresh the page. If the problem continues, contact <a href="mailto:'+SUPPORT_EMAIL+'">'+SUPPORT_EMAIL+'</a>.</div>');}
function renderPaid(){document.getElementById('app').innerHTML=pageShell('<div class="payment-card"><div class="status-note success" style="text-align:left;margin:0;"><strong>Thank you. Your payment has been received.</strong><br>We’ll begin preparing your return and will reach out by email if we need anything else.</div></div>',{paid:true});}
function renderPaymentPage(){const firstName=((paymentState.name||'').split(' ')[0]||'there');const amount=paymentState.amount||paymentState.quoteAmount||0;const currency=paymentState.currency||'USD';const description=paymentState.description||paymentState.quoteDescription||'Tax preparation fee';const paid=paymentState.paid||paymentState.paymentStatus==='Paid'||paymentState.paymentStatus==='paid';if(paid){renderPaid();return;}if(!amount){document.getElementById('app').innerHTML=pageShell('<div class="status-note warning"><strong>Your quote is not available yet.</strong><br>Please use the payment link from your Calm Tax Co. email after your quote has been finalized.</div>');return;}const cancelNotice=RETURN_STATUS==='cancel'?'<div class="status-note warning"><strong>Payment was not completed.</strong><br>You can try again below.</div>':'';document.getElementById('app').innerHTML=pageShell('<p class="intro">Hi '+esc(firstName)+', your documents have been reviewed and your personalized quote is ready.</p>'+cancelNotice+'<div class="payment-card"><div class="quote-box"><div class="quote-description">'+esc(description)+'</div><div class="quote-amount">'+esc(money(amount,currency))+'</div></div><div class="approval-box"><label class="approval-label"><input type="checkbox" id="approvalCheck" onchange="document.getElementById(\'stripeBtn\').disabled=!this.checked"><span>I approve this quote and authorize Calm Tax Co. to begin preparing my return after payment is received. I understand that I will receive access to a copy of my completed return and must separately authorize e-filing before my return can be submitted. I agree to the <a href="/engagement/" target="_blank" rel="noopener">Engagement Agreement</a>.</span></label></div><button class="btn" id="stripeBtn" disabled onclick="startStripeCheckout()"><span class="stripe-wordmark">stripe</span> <span class="checkout-word">Checkout</span></button><p class="microcopy">Secure payment processing by Stripe.<br>After payment is received, we’ll begin preparing your return.</p></div>');}
async function startStripeCheckout(){const btn=document.getElementById('stripeBtn');if(btn){btn.disabled=true;btn.textContent='Opening checkout…';}try{const data=await api({form_type:'createStripeCheckoutSession',clientId:CLIENT_ID,engagementApproved:true,engagementVersion:'2026-06-23',successUrl:location.origin+location.pathname+'?c='+encodeURIComponent(CLIENT_ID)+'&status=success&session_id={CHECKOUT_SESSION_ID}',cancelUrl:location.origin+location.pathname+'?c='+encodeURIComponent(CLIENT_ID)+'&status=cancel'});if(!data.url)throw new Error('No Stripe checkout URL was returned.');location.href=data.url;}catch(error){alert('Could not open secure checkout: '+error.message);if(btn){btn.disabled=false;btn.innerHTML='<span class="stripe-wordmark">stripe</span> <span class="checkout-word">Checkout</span>';}}}
async function load(){try{if(!CLIENT_ID)throw new Error('Missing payment link code. Please use the payment link from your Calm Tax Co. email.');if(RETURN_STATUS==='success'&&SESSION_ID){document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div>Confirming your payment…</div>';paymentState=await api({form_type:'verifyStripeCheckoutSession',clientId:CLIENT_ID,sessionId:SESSION_ID});renderPaid();return;}paymentState=await api({form_type:'getPaymentQuote',clientId:CLIENT_ID});renderPaymentPage();}catch(error){renderError(error.message);}}
window.addEventListener('error',function(event){const app=document.getElementById('app');if(app&&app.textContent.indexOf('Loading your payment page')!==-1)renderError(event.message||'A page error occurred.');});
window.addEventListener('unhandledrejection',function(event){const reason=event.reason&&event.reason.message?event.reason.message:String(event.reason||'A request error occurred.');const app=document.getElementById('app');if(app&&app.textContent.indexOf('Loading your payment page')!==-1)renderError(reason);});
load();
</script>
</body>
</html>
